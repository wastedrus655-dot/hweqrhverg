// ── Auto Counter engine (ported from Sero tab9) ───────────────────────────
const CTR_WORD_MAPS={
  en:['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'],
  es:['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte'],
  fr:['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf','vingt'],
  de:['','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn','zwanzig'],
  ja:['','一','二','三','四','五','六','七','八','九','十'],
  zh:['','一','二','三','四','五','六','七','八','九','十'],
  ko:['','일','이','삼','사','오','육','칠','팔','구','십'],
  ru:['','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять'],
};
function ctrToRoman(n){
  const vals=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const syms=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';for(let i=0;i<vals.length;i++){while(n>=vals[i]){r+=syms[i];n-=vals[i];}}return r;
}
function ctrGetNumWord(n,lang){
  const map=CTR_WORD_MAPS[lang];
  if(!map||n<1||n>=map.length)return null;
  return map[n];
}
function ctrBuildMessage(num,{affixMode,affixFixed,affixRand,lang,numFmt}){
  let numStr=String(num);
  if(lang&&lang!=='none'){
    if(lang==='roman')numStr=ctrToRoman(num);
    else{const w=ctrGetNumWord(num,lang);if(w)numStr=w;}
    if(numFmt==='numword')numStr=num+' '+numStr;
    else if(numFmt==='wordnum')numStr=numStr+' '+num;
  }
  if(affixMode==='none')return numStr;
  if(affixMode==='fixed-prefix')return (affixFixed||'')+numStr;
  if(affixMode==='fixed-suffix')return numStr+(affixFixed||'');
  const pool=(affixRand||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const pick=pool.length?pool[Math.floor(Math.random()*pool.length)]:'';
  if(affixMode==='rand-prefix')return pick+numStr;
  return numStr+pick;
}
async function ctrDiscordSend(token,channelId,content,signal,maxRetries=3){
  for(let attempt=1;attempt<=maxRetries;attempt++){
    if(signal?.aborted)throw new DOMException('Aborted','AbortError');
    try{
      const r=await fetch(`https://discord.com/api/v10/channels/${channelId}/messages`,{
        method:'POST',
        headers:{Authorization:token,'Content-Type':'application/json'},
        body:JSON.stringify({content,allowed_mentions:{parse:[]}}),
        signal,
      });
      if(r.status===429){
        let ms=1000;try{const d=await r.json();ms=Math.ceil((d.retry_after||1)*1000);}catch{}
        await new Promise((res,rej)=>{const t=setTimeout(res,ms);signal?.addEventListener('abort',()=>{clearTimeout(t);rej(new DOMException('Aborted','AbortError'));},{once:true});});
        continue;
      }
      if(!r.ok)throw new Error('HTTP '+r.status);
      const data=await r.json();
      if(data?.id||data?.content)return data;
      throw new Error('No message id');
    }catch(e){
      if(e.name==='AbortError')throw e;
      if(attempt>=maxRetries)throw e;
      await new Promise((res,rej)=>{const t=setTimeout(res,1000*attempt);signal?.addEventListener('abort',()=>{clearTimeout(t);rej(new DOMException('Aborted','AbortError'));},{once:true});});
    }
  }
}

function AutoCounterTab({clients}){
  const tokenClients=(clients||[]).filter(c=>c.token);
  const [selectedIds,setSelectedIds]=useState([]);
  const [channelId,setChannelId]=useState('');
  const [mode,setMode]=useState('asc');
  const [startNum,setStartNum]=useState(1);
  const [endNum,setEndNum]=useState(100);
  const [delaySec,setDelaySec]=useState(1.5);
  const [staggerMs,setStaggerMs]=useState(500);
  const [affixMode,setAffixMode]=useState('none');
  const [affixFixed,setAffixFixed]=useState('');
  const [affixRand,setAffixRand]=useState('');
  const [lang,setLang]=useState('none');
  const [numFmt,setNumFmt]=useState('word');
  const [running,setRunning]=useState(false);
  const [status,setStatus]=useState({label:'Idle',type:''});
  const [progress,setProgress]=useState('—');
  const [log,setLog]=useState([]);
  const runningRef=useRef(false);
  const abortRef=useRef(null);

  const selectedAccounts=selectedIds.map(id=>tokenClients.find(c=>c.id===id)).filter(Boolean);
  const buildOpts=()=>({affixMode,affixFixed,affixRand,lang,numFmt});

  const addLog=(num,who,what,isSent)=>{
    const time=new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
    setLog(p=>[{num,who,what,isSent,time,id:Date.now()+Math.random()},...p].slice(0,100));
  };

  const toggleAccount=(id)=>{
    setSelectedIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  };

  const stopCounter=useCallback(()=>{
    runningRef.current=false;
    setRunning(false);
    if(abortRef.current){try{abortRef.current.abort();}catch{}abortRef.current=null;}
    setStatus({label:'Idle',type:''});
  },[]);

  const startCounter=useCallback(async()=>{
    if(!selectedAccounts.length){addLog('!','System','Connect at least one account',false);return;}
    const ch=channelId.trim();
    if(!ch){addLog('!','System','Enter a channel ID',false);return;}
    const accounts=selectedAccounts.map(c=>({token:c.token,name:c.tag||'Account'}));
    const start=parseInt(startNum,10)||1;
    const end=parseInt(endNum,10)||100;
    const delayMs=Math.round((parseFloat(delaySec)||1.5)*1000);
    const stagger=parseInt(staggerMs,10)||500;
    const opts=buildOpts();
    runningRef.current=true;
    setRunning(true);
    setLog([]);
    if(abortRef.current){try{abortRef.current.abort();}catch{}}
    abortRef.current=new AbortController();
    const signal=abortRef.current.signal;
    setStatus({label:'Starting…',type:'wait'});
    addLog('▶','Counter','Order: '+accounts.map((a,i)=>'T'+(i+1)+':'+a.name).join(' → '),false);

    const isAsc=mode==='asc';
    const total=Math.abs(end-start)+1;
    let current=start;
    let sent=0;
    const tokenCount=accounts.length;

    try{
      while(runningRef.current&&!signal.aborted){
        const done=isAsc?(current>end):(current<end);
        if(done){
          addLog('✓','Counter','Finished — sent '+sent+' numbers',false);
          stopCounter();
          return;
        }
        const tokenIdx=sent%tokenCount;
        const acct=accounts[tokenIdx];
        const msg=ctrBuildMessage(current,opts);
        setProgress(`${current} / ${isAsc?end:start} · token ${tokenIdx+1}/${tokenCount} · ${sent+1}/${total}`);
        setStatus({label:`Sending #${current} via Token ${tokenIdx+1}`,type:'wait'});
        try{
          await ctrDiscordSend(acct.token,ch,msg,signal);
          addLog(msg,acct.name,`Token ${tokenIdx+1} sent #${current}`,true);
        }catch(e){
          if(e.name==='AbortError')return;
          addLog(String(current),acct.name,`Token ${tokenIdx+1} FAILED — skipped`,false);
        }
        sent++;
        current+=isAsc?1:-1;
        if(signal.aborted)return;
        const isNewRound=(sent%tokenCount===0);
        const waitMs=delayMs+(isNewRound?stagger:0);
        await new Promise((res,rej)=>{const t=setTimeout(res,waitMs);signal.addEventListener('abort',()=>{clearTimeout(t);rej(new DOMException('Aborted','AbortError'));},{once:true});});
      }
    }catch(e){
      if(e.name!=='AbortError')addLog('!','Error',e.message||String(e),false);
    }
  },[selectedAccounts,channelId,mode,startNum,endNum,delaySec,staggerMs,affixMode,affixFixed,affixRand,lang,numFmt,stopCounter]);

  useEffect(()=>()=>{if(abortRef.current)abortRef.current.abort();},[]);

  const langPreview=lang!=='none'?[1,2,3,4,5].map(n=>ctrBuildMessage(n,buildOpts())).join('  '):'';

  return html`
    <div class="view-content animate-fade counter-shell">
      <div class="counter-hero">
        <div class="view-hero-inner">
          <h1 class="view-hero-title">Auto Counter</h1>
          <p class="view-hero-sub">Multi-token counting — each token sends the next number in order.</p>
          <div class="counter-status-row">
            <div class=${'counter-live-dot'+(status.type==='on'?' on':status.type==='wait'?' waiting':'')}></div>
            <div class=${'counter-badge '+(status.type==='on'?'active':status.type==='wait'?'waiting':'idle')}>${status.label}</div>
            ${channelId&&html`<span style="font-size:12px;color:var(--text-2);font-family:var(--font-mono)">#${channelId.slice(0,20)}</span>`}
          </div>
        </div>
      </div>

      <div class="view-panel" style="margin-bottom:18px">
        <div class="view-panel-hdr">
          <div class="view-panel-title"><span class="view-panel-icon"><${I} name="users" size=${16}/></span> Accounts</div>
          <div class="counter-panel-hdr-actions">
            <button class="btn-secondary" style="padding:6px 12px;font-size:12px" onClick=${()=>setSelectedIds(tokenClients.map(c=>c.id))}>All</button>
            <button class="btn-secondary" style="padding:6px 12px;font-size:12px" onClick=${()=>setSelectedIds([])}>None</button>
          </div>
        </div>
        <div class="view-panel-body">
          ${tokenClients.length===0
            ? html`<div class="view-empty">No accounts in Settings. Add tokens first.</div>`
            : html`<div class="counter-acct-grid">
              ${tokenClients.map(c=>{
                const sel=selectedIds.includes(c.id);
                const orderIdx=selectedIds.indexOf(c.id);
                return html`
                  <div key=${c.id} class=${'counter-acct-card'+(sel?' selected':'')} style="cursor:pointer" onClick=${()=>toggleAccount(c.id)}>
                    <div class="avatar" style="width:34px;height:34px;border-radius:9px;overflow:hidden;flex-shrink:0;background:var(--bg-hover);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px">
                      ${c.avatarURL?html`<img src=${c.avatarURL} style="width:100%;height:100%;object-fit:cover"/>`:(c.tag||'?')[0].toUpperCase()}
                    </div>
                    <div class="counter-acct-meta">
                      <div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.tag||'Account'}${orderIdx>=0?html`<span style="margin-left:6px;font-size:10px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);padding:1px 7px;border-radius:100px">#${orderIdx+1}</span>`:''}</div>

          </div>

        <div class="counter-log">
          <div class="counter-log-head">
            <div class="counter-log-head-row">
              <div style="font-size:11px;font-weight:800;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em">Live Log · ${log.length}</div>

            </div>
            <div class="counter-log-progress">${progress}</div>
          </div>
          <div class="counter-log-body">
            ${log.length===0
              ? html`<div class="view-empty" style="padding:24px">No events yet. Start the counter below.</div>`
              : log.map(row=>html`
                <div key=${row.id} class="counter-log-row">
                  <div class=${'counter-log-num'+(row.isSent?' sent':'')}>${row.num}</div>
                  <div><div class="counter-log-who">${row.who}</div><div class="counter-log-what">${row.what}</div></div>
                  <div class="counter-log-time">${row.time}</div>
                </div>`)}
          </div>
        </div>
      </div>

      <div class="counter-actions">
        <button type="button" class=${'counter-start-btn'+(running?' stop':'')} onClick=${()=>running?stopCounter():startCounter()}>
          <${I} name=${running?'x':'send'} size=${16}/>
          ${running?'Stop':'Start'}
        </button>
      </div>
    </div>`;
}

const BEEF_DEFAULT_WORDLIST=BEEF_DEFAULT_RAW.split('\n').map(s=>s.trim()).filter(Boolean);

function beefParseWordlist(text){
  return String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
}
function beefPickLine(lines,last){
  if(!lines.length)return '';
  if(lines.length===1)return lines[0];
  let pick;
  do{pick=lines[Math.floor(Math.random()*lines.length)];}while(pick===last);
  return pick;
}
function beefApplyCase(text,mode){
  if(mode==='upper')return text.toUpperCase();
  if(mode==='lower')return text.toLowerCase();
  return text;
}

function AutoBeefTab({clients}){
  const tokenClients=(clients||[]).filter(c=>c.token);
  const [selectedId,setSelectedId]=useState('');
  const [customLines,setCustomLines]=useState(null);
  const [importName,setImportName]=useState('');
  const [channelId,setChannelId]=useState('');
  const [delaySec,setDelaySec]=useState(5);
  const [textCase,setTextCase]=useState('upper');
  const [running,setRunning]=useState(false);
  const [status,setStatus]=useState({label:'Idle',type:''});
  const [sentCount,setSentCount]=useState(0);
  const [log,setLog]=useState([]);
  const runningRef=useRef(false);
  const abortRef=useRef(null);
  const lastLineRef=useRef('');
  const fileRef=useRef(null);

  const activeLines=customLines?.length?customLines:BEEF_DEFAULT_WORDLIST;
  const selectedClient=tokenClients.find(c=>c.id===selectedId);

  const addLog=(msg,ok=true)=>{
    const time=new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
    setLog(p=>[{msg,ok,time,id:Date.now()+Math.random()},...p].slice(0,100));
  };

  const stopBeef=useCallback(()=>{
    runningRef.current=false;
    setRunning(false);
    if(abortRef.current){try{abortRef.current.abort();}catch{}abortRef.current=null;}
    setStatus({label:'Stopped',type:''});
  },[]);

  const startBeef=useCallback(async()=>{
    const client=tokenClients.find(c=>c.id===selectedId);
    if(!client?.token){addLog('Select a token first',false);return;}
    const ch=channelId.trim();
    if(!ch){addLog('Enter a channel ID',false);return;}
    const lines=activeLines;
    if(!lines.length){addLog('Wordlist is empty',false);return;}
    const delayMs=Math.max(1000,Math.round((parseFloat(delaySec)||5)*1000));
    runningRef.current=true;
    setRunning(true);
    setSentCount(0);
    lastLineRef.current='';
    if(abortRef.current){try{abortRef.current.abort();}catch{}}
    abortRef.current=new AbortController();
    const signal=abortRef.current.signal;
    setStatus({label:'Running…',type:'wait'});
    addLog(`Started · ${lines.length} lines · ${delaySec}s delay · ${textCase} case`);

    try{
      while(runningRef.current&&!signal.aborted){
        const raw=beefPickLine(lines,lastLineRef.current);
        lastLineRef.current=raw;
        const msg=beefApplyCase(raw,textCase);
        setStatus({label:`Sending…`,type:'wait'});
        try{
          await ctrDiscordSend(client.token,ch,msg,signal);
          setSentCount(n=>n+1);
          addLog(msg,true);
        }catch(e){
          if(e.name==='AbortError')return;
          addLog(`Failed: ${e.message||'send error'}`,false);
        }
        if(signal.aborted)return;
        await new Promise((res,rej)=>{const t=setTimeout(res,delayMs);signal.addEventListener('abort',()=>{clearTimeout(t);rej(new DOMException('Aborted','AbortError'));},{once:true});});
      }
    }catch(e){
      if(e.name!=='AbortError')addLog(e.message||String(e),false);
    }
  },[selectedId,channelId,delaySec,textCase,activeLines,tokenClients]);

  useEffect(()=>()=>{if(abortRef.current)abortRef.current.abort();},[]);

  const onImportFile=e=>{
    const f=e.target.files?.[0];
    if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      const lines=beefParseWordlist(reader.result);
      if(!lines.length){toast('Wordlist file is empty','error');return;}
      setCustomLines(lines);
      setImportName(f.name);
      toast(`Imported ${lines.length} lines`,'success');
    };
    reader.readAsText(f);
    e.target.value='';
  };

  const clearImport=()=>{setCustomLines(null);setImportName('');toast('Using built-in wordlist','success');};

  return html`
    <div class="view-content animate-fade counter-shell">
      <div class="counter-hero">
        <div class="view-hero-inner">
          <h1 class="view-hero-title">Autobeef</h1>
          <p class="view-hero-sub">Send random lines from a wordlist on a timer — no repeats back-to-back.</p>
          <div class="counter-status-row">
            <div class=${'counter-live-dot'+(status.type==='on'?' on':status.type==='wait'?' waiting':'')}></div>
            <div class=${'counter-badge '+(running?'waiting':'idle')}>${status.label}</div>
            ${sentCount>0&&html`<span style="font-size:12px;color:var(--text-2)">${sentCount} sent</span>`}
          </div>
        </div>
      </div>

      <div class="counter-layout">
        <div class="view-panel">
          <div class="view-panel-hdr"><div class="view-panel-title"><span class="view-panel-icon"><${I} name="flame" size=${16}/></span> Setup</div></div>
          <div class="view-panel-body" style="gap:16px">
            <div>
              <div style="font-size:10px;font-weight:800;color:var(--text-3);text-transform:uppercase;margin-bottom:6px">Token</div>
              ${tokenClients.length===0
                ? html`<div class="view-empty" style="padding:20px">Add tokens in Settings first.</div>`
                : html`<select class="counter-select" value=${selectedId} onChange=${e=>setSelectedId(e.target.value)}>
                    <option value="">Select account…</option>
                    ${tokenClients.map(c=>html`<option key=${c.id} value=${c.id}>${c.tag||'Account'}${c.active?' · online':''}</option>`)}
                  </select>`}
            </div>
            <div>
              <div style="font-size:10px;font-weight:800;color:var(--text-3);text-transform:uppercase;margin-bottom:6px">Channel ID</div>
              <input class="counter-inp" placeholder="Discord channel ID…" value=${channelId} onInput=${e=>setChannelId(e.target.value)}/>
            </div>
            <div>
              <div style="font-size:10px;font-weight:800;color:var(--text-3);text-transform:uppercase;margin-bottom:6px">Wordlist · ${activeLines.length} lines</div>
              <div class="beef-import-zone">
                <input ref=${fileRef} type="file" accept=".txt,text/plain" style="display:none" onChange=${onImportFile}/>
                <button type="button" class="beef-import-btn" onClick=${()=>fileRef.current?.click()}>
                  <${I} name="upload" size=${14}/> Import .txt
                </button>
                ${importName&&html`
                  <span style="font-size:12px;color:var(--text-2);font-weight:600">${importName}</span>
                  <button type="button" class="btn-secondary" style="padding:6px 12px;font-size:11px" onClick=${clearImport}>Reset to default</button>`}
                ${!importName&&html`<span style="font-size:11px;color:var(--text-3)">Using built-in list</span>`}
              </div>
              <div class="beef-wordlist-preview" style="margin-top:10px">${activeLines.slice(0,8).join(' · ')}${activeLines.length>8?' …':''}</div>
            </div>
            <div>
              <label class="inp-label" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                <span style="text-transform:uppercase;letter-spacing:.06em">Delay</span>
                <span style=${{fontFamily:'var(--font-mono)',fontSize:'12px',fontWeight:'700',color:'var(--text-0)',padding:'3px 10px',background:'var(--bg-void)',borderRadius:'6px',border:'1px solid var(--border-soft)'}}>${delaySec}s</span>
              </label>
              <div style="padding:14px 16px;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:var(--r-lg)">
                <div class="vol-slider">
                  <div class="vol-slider-track"></div>
                  <div class="vol-slider-fill" style=${{width:(((delaySec-1)/59)*100)+'%'}}></div>
                  <input type="range" class="vol-slider-input" min="1" max="60" step="1" value=${delaySec}
                    onInput=${e=>setDelaySec(Number(e.target.value))}/>
                </div>
                <div class="vol-slider-labels">
                  <span>1s</span>
                  <span>30s</span>
                  <span>60s</span>
                </div>
              </div>
            </div>
            <div>
              <div style="font-size:10px;font-weight:800;color:var(--text-3);text-transform:uppercase;margin-bottom:8px">Case</div>
              <div class="beef-case-row">
                <button type="button" class=${'beef-case-btn'+(textCase==='upper'?' active':'')} onClick=${()=>setTextCase('upper')}>UPPER</button>
                <button type="button" class=${'beef-case-btn'+(textCase==='lower'?' active':'')} onClick=${()=>setTextCase('lower')}>lower</button>
                <button type="button" class=${'beef-case-btn'+(textCase==='default'?' active':'')} onClick=${()=>setTextCase('default')}>Default</button>
              </div>
            </div>
          </div>
        </div>

        <div class="counter-log">
          <div class="counter-log-head">
            <div class="counter-log-head-row">
              <div style="font-size:11px;font-weight:800;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em">Live Log · ${log.length}</div>
              <button class="btn-secondary" style="padding:5px 10px;font-size:11px" onClick=${()=>setLog([])}>Clear</button>
            </div>
            <div class="counter-log-progress">${selectedClient?(selectedClient.tag||'Account'):'No token'} · #${channelId||'—'}</div>
          </div>
          <div class="counter-log-body">
            ${log.length===0
              ? html`<div class="view-empty" style="padding:24px">No messages sent yet.</div>`
              : log.map(row=>html`
                <div key=${row.id} class="counter-log-row">
                  <div class=${'counter-log-num'+(row.ok?' sent':'')} style="font-size:11px;min-width:28px">${row.ok?'✓':'!'}</div>
                  <div><div class="counter-log-what" style="font-size:12px;color:var(--text-0);word-break:break-word">${row.msg}</div></div>
                  <div class="counter-log-time">${row.time}</div>
                </div>`)}
          </div>
        </div>
      </div>

      <div class="counter-actions">
        <button type="button" class=${'counter-start-btn'+(running?' stop':'')} onClick=${()=>running?stopBeef():startBeef()}>
          <${I} name=${running?'x':'flame'} size=${16}/>
          ${running?'Stop':'Start'}
        </button>
      </div>
    </div>`;
}

  const [dmMessages,setDmMessages]=useState({});
  const [liveMessages,setLiveMessages]=useState([]);
  const [multiState,setMultiState]=useState({globalChannel:'',sendChannel:'',msgContent:'',delay:1000});
  const [precountBanner,setPrecountBanner]=useState(null);
  const lastPrecountRef=useRef(null);
  const configRef=useRef(config);
  const playAlertRef=useRef(null);
  const audioCtxRef=useRef(null);
  const gainNodeRef=useRef(null);
  const loopSourceRef=useRef(null);
  const loopBufferRef=useRef(null);
  const [soundPlaying,setSoundPlaying]=useState(false);
  const soundPlayingRef=useRef(false);
  const [notifPerm,setNotifPerm]=useState(()=>'Notification' in window?Notification.permission:'unsupported');

  const getAudioCtx=()=>{
    if(!audioCtxRef.current){
      audioCtxRef.current=new (window.AudioContext||window.webkitAudioContext)();
      gainNodeRef.current=audioCtxRef.current.createGain();
      gainNodeRef.current.connect(audioCtxRef.current.destination);
    }
    if(audioCtxRef.current.state==='suspended')audioCtxRef.current.resume();
    return audioCtxRef.current;
  };

  const makeBeepBuffer=(ctx)=>{
    const sr=ctx.sampleRate,dur=0.18,freq=880;
    const buf=ctx.createBuffer(1,Math.floor(sr*dur),sr);
    const data=buf.getChannelData(0);
    for(let i=0;i<data.length;i++){
      const t=i/sr;
      const env=t<0.01?t/0.01:t>0.14?Math.max(0,(0.18-t)/0.04):1;
      data[i]=Math.sin(2*Math.PI*freq*t)*env*0.7;
    }
    return buf;
  };

  const stopSound=useCallback(()=>{
    if(loopSourceRef.current){try{loopSourceRef.current.stop();}catch{}loopSourceRef.current=null;}
    soundPlayingRef.current=false;setSoundPlaying(false);
  },[]);

  const playAlert=useCallback(async()=>{
    const cfg=configRef.current;
    const vol=cfg?.globalSettings?.alertVolume??1.0;
    const ctx=getAudioCtx();
    gainNodeRef.current.gain.setValueAtTime(vol,ctx.currentTime);

    // Get or decode buffer
    let buf=loopBufferRef.current;
    const url=cfg?.globalSettings?.alertSoundUrl||'';
    if(!buf||buf._url!==url){
      if(url){
        try{
          const resp=await fetch(url);
          const ab=await resp.arrayBuffer();
          buf=await ctx.decodeAudioData(ab);
          buf._url=url;
          loopBufferRef.current=buf;
        }catch{buf=null;loopBufferRef.current=null;}
      }
      if(!buf){
        buf=makeBeepBuffer(ctx);
        buf._url='__beep__';
        loopBufferRef.current=buf;
      }
    }

    // Stop any existing loop
    if(loopSourceRef.current){try{loopSourceRef.current.stop();}catch{}loopSourceRef.current=null;}

    const src=ctx.createBufferSource();
    src.buffer=buf;
    src.loop=true;
    src.connect(gainNodeRef.current);
    src.start();
    loopSourceRef.current=src;
    soundPlayingRef.current=true;setSoundPlaying(true);
  },[]);
  playAlertRef.current=playAlert;

  const loadData=async()=>{
    const cfg=await invoke('config-load');if(cfg){setConfig(cfg);configRef.current=cfg;}
    const cls=await invoke('get-active-clients');if(cls)setClients(cls);
    const ms=await invoke('get-multi-state');if(ms)setMultiState(p=>({...p,...ms}));
  };

  const clientsRef=useRef([]);
  useEffect(()=>{clientsRef.current=clients;},[clients]);

  const handleMessage=useCallback((msg)=>{
    setRawMessages(p=>{const prev=p[msg.clientId]||[];const idx=prev.findIndex(m=>m.id===msg.id);if(idx!==-1){const next=[...prev];next[idx]=msg;return{...p,[msg.clientId]:next};}return{...p,[msg.clientId]:[...prev,msg].slice(-1000)};});
    // Push notification for check/AFK tags on new messages only
    if(msg.id&&!msg.edited){
      const tags=detectTriggerTags(msg.content||'',msg.embeds||[],msg.authorId);
      if(tags.length>0&&!isOwnNodeAuthor(msg.authorId)){
        const tagNames=tags.map(t=>t.tag).join(', ');
        sendPushNotification(`🚨 ${msg.author}: ${tags[0].tag}`,tagNames+(msg.content?` — ${msg.content.slice(0,80)}`:''));
      }
    }
  },[]);

  // handleDmMessage: stores in dmMessages AND adds to liveMessages feed
  const handleDmMessage=useCallback((msg)=>{
    setDmMessages(p=>{const prev=p[msg.channelId]||[];const idx=prev.findIndex(m=>m.id===msg.id);if(idx!==-1){const next=[...prev];next[idx]=msg;return{...p,[msg.channelId]:next};}return{...p,[msg.channelId]:[...prev,msg].slice(-2000)};});
  },[]);

  // handleLiveMessage: receives ANY message event (dm, group, server) for the live feed
  const handleLiveMessage=useCallback((msg)=>{
    setLiveMessages(p=>{
      const idx=p.findIndex(m=>m.id===msg.id);
      if(idx!==-1){const next=[...p];next[idx]={...msg,_new:false};return next;}
      const live={
        id:msg.id,
        channelId:msg.channel_id||msg.channelId,
        channelName:msg.channelName||null,
        guildId:msg.guild_id||msg.guildId||null,
        guildName:msg.guildName||null,
        author:msg.author?.username||msg.author||'?',
        avatarURL:msg.author?.avatar&&msg.author?.id?`https://cdn.discordapp.com/avatars/${msg.author.id}/${msg.author.avatar}.png?size=64`:(msg.avatarURL||null),
        content:msg.content||'',
        timestamp:msg.timestamp||new Date().toISOString(),
        attachments:msg.attachments||[],
        type:msg._liveType||'dm',
        _new:true,
      };
      return [...p,live].slice(-500);
    });
    // Clear _new flag after 3s
    setTimeout(()=>{setLiveMessages(p=>p.map(m=>m.id===msg.id?{...m,_new:false}:m));},3000);
  },[]);

  const handleAlert=useCallback((a)=>{
    if(a.clientId&&!DB.getClients().find(c=>c.id===a.clientId))return;
    if(a.authorId&&isOwnNodeAuthor(a.authorId))return;
    const wi={...a,id:Date.now()+Math.random(),read:false};setAlerts(p=>[wi,...p].slice(0,200));playAlertRef.current?.();if(a.type==='precount'||a.type==='multi'){lastPrecountRef.current=wi;setPrecountBanner(wi);}
  },[]);
  const handleStatusChange=useCallback((clientId,active)=>{setClients(p=>p.map(c=>c.id===clientId?{...c,active}:c));const up=DB.getClients().map(c=>c.id===clientId?{...c,active}:c);DB.setClients(up);},[]);

  useEffect(()=>{const onFocus=()=>{if(document.visibilityState==='visible'&&lastPrecountRef.current){setPrecountBanner(lastPrecountRef.current);}};document.addEventListener('visibilitychange',onFocus);return()=>document.removeEventListener('visibilitychange',onFocus);},[]);

  const clientIdsKey=clients.map(c=>c.id).join(',');
  useEffect(()=>{
    if(!clients.length)return;
    clients.forEach(c=>{if(!activeGateways.has(c.id))connectGatewayFull(c,handleMessage,handleAlert,handleStatusChange,handleDmMessage,handleLiveMessage);});
    activeGateways.forEach((_,id)=>{if(!clients.find(c=>c.id===id))disconnectGateway(id);});
  },[clientIdsKey]);

  const reconnectClient=useCallback((cid)=>{const c=DB.getClients().find(x=>x.id===cid);if(!c)return;disconnectGateway(cid);connectGatewayFull(c,handleMessage,handleAlert,handleStatusChange,handleDmMessage,handleLiveMessage);},[handleMessage,handleAlert,handleStatusChange]);
  const saveConfig=(nc)=>{invoke('config-save',nc);setConfig(nc);configRef.current=nc;};

  // playAlert is now defined above with Web Audio API

  useEffect(()=>{loadData();},[]);

  useEffect(()=>{
    const checkCounting=async(token,channelId)=>{
      try{
        const [chData,history]=await Promise.all([fetch(`https://discord.com/api/v10/channels/${channelId}`,{headers:{Authorization:token}}).then(r=>r.json()).catch(()=>null),fetch(`https://discord.com/api/v10/channels/${channelId}/messages?limit=50`,{headers:{Authorization:token}}).then(r=>r.json()).catch(()=>null)]);
        if(!Array.isArray(history))return;
        const latest=history[0];if(!latest)return;
        const lc=latest.content?.trim()||'';const ln=Number(lc);
        if(!/^\d+$/.test(lc)||ln<0||ln>1000000)return;
        const authorId=latest.author?.id;
        if(isOwnNodeAuthor(authorId))return;
        const realMsg=history.filter(m=>m.author?.id===authorId).slice(1).find(m=>{const c2=m.content?.normalize('NFKC').replace(/[^\p{L}\p{N}]/gu,'').toLowerCase()||'';return!/^\d+$/.test(c2)&&!bypassSet.has(c2)&&c2.length>0;});
        if(!realMsg)return;
        let prevText=realMsg.content||'[Media]';
        if(realMsg.attachments?.length)prevText+=' [📎]';if(realMsg.embeds?.length)prevText+=' [🔗]';
        const banner={id:Date.now()+Math.random(),type:'precount',author:latest.author?.username||'Unknown',channelName:chData?.name||null,channelId,prevMsg:prevText,countStart:lc,timestamp:new Date().toISOString()};
        lastPrecountRef.current=banner;setPrecountBanner(banner);
      }catch{}
    };
    const onVisible=()=>{
      if(document.visibilityState!=='visible')return;
      const stored=DB.getClients();
      stored.forEach(c=>{if(!activeGateways.has(c.id))connectGatewayFull(c,handleMessage,handleAlert,handleStatusChange,handleDmMessage,handleLiveMessage);});
      const checked=new Set();
      if(!DB.getConfig()?.globalSettings?.disableCounting){
        stored.filter(c=>c.type==='single'&&c.listenChannelId&&c.token).forEach(c=>{if(!checked.has(c.listenChannelId)){checked.add(c.listenChannelId);checkCounting(c.token,c.listenChannelId);}});
        const mc=stored.filter(c=>c.type==='multi'&&c.token);const gc=DB.getMulti().globalChannel;
        if(mc.length>0&&gc)checkCounting(mc[0].token,gc);
      }
    };
    document.addEventListener('visibilitychange',onVisible);
    return()=>document.removeEventListener('visibilitychange',onVisible);
  },[handleMessage,handleAlert,handleStatusChange]);

  const markAlertsAsRead=(clientId=null)=>{setAlerts(p=>p.map(a=>(!clientId||a.clientId===clientId)&&!a.read?{...a,read:true}:a));};
  const clearAlerts=(clientId=null,channelId=null)=>{setAlerts(p=>p.filter(a=>{if(clientId&&a.clientId===clientId)return false;if(channelId&&a.channelId===channelId&&a.type==='precount')return false;if(!clientId&&!channelId)return false;return true;}));};

  const unreadMap=alerts.reduce((acc,a)=>{if(!a.read&&a.type==='telemetry')acc[a.clientId]=(acc[a.clientId]||0)+1;return acc;},{});

  const mainTabs=[
    {id:'dashboard',label:'Overview', icon:'layout'},
    {id:'single',   label:'Monitor',  icon:'target'},
    {id:'multi',    label:'Broadcast',icon:'send'},
    {id:'counter',  label:'Counting', icon:'hash'},
    {id:'beef',     label:'Autobeef', icon:'flame'},
    {id:'detections',label:'Detections',icon:'activity'},
    {id:'dms',      label:'Messages', icon:'users'},
    {id:'settings', label:'Settings', icon:'settings'},
  ];

  return html`
    <div id="app-layout">
      <div class="sidebar">
        <div class="sidebar-hdr">
          <div class="sidebar-logo">
            <${I} name="zap" size=${18} style="color:#fff"/>
          </div>
          <span class="sidebar-title">RobyCord</span>
        </div>
        <div class="nav-group">
          ${mainTabs.map(t=>html`
            <button key=${t.id} class="nav-item ${tab===t.id?'active':''}" onClick=${()=>setTab(t.id)}>
              <${I} name=${t.icon} size=${18} style=${{opacity:tab===t.id?'1':'0.5'}}/>
              <span>${t.label}</span>
            </button>
          `)}
          <button class="nav-item" title=${notifPerm==='granted'?'Push alerts on':'Enable push alerts'}
            onClick=${()=>{if(notifPerm!=='granted'&&notifPerm!=='denied')requestPushPermission(ok=>{if(ok)setNotifPerm('granted');else setNotifPerm('denied');});}}
            style=${{color:notifPerm==='granted'?'var(--success)':notifPerm==='denied'?'var(--danger)':'var(--text-2)'}}>
            ${notifPerm==='granted'
              ? html`<${I} name="bell" size=${16} style="color:var(--success)"/>`
              : notifPerm==='denied'
              ? html`<${I} name="bell-off" size=${16} style="color:var(--danger)"/>`
              : html`<${I} name="bell" size=${16}/>`}
            <span>${notifPerm==='granted'?'Alerts On':notifPerm==='denied'?'Blocked':'Alerts'}</span>
          </button>
        </div>
        <div class="sidebar-ftr">
          <div class="status-card">
            <div class="status-dot on"></div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:700;color:var(--text-1)">Active</div>
              <div style="font-size:11px;color:var(--text-3);font-weight:600;margin-top:2px">${clients.filter(c=>c.active).length} nodes online</div>
            </div>
          </div>
          ${notifPerm!=='granted'&&html`
            <button onClick=${()=>requestPushPermission(ok=>{if(ok)setNotifPerm('granted');})}
              style=${{marginTop:'10px',width:'100%',background:'var(--accent-soft)',border:'1px solid var(--accent-line)',borderRadius:'var(--r-md)',padding:'9px 12px',color:'var(--accent)',fontSize:'11px',fontWeight:'700',display:'flex',alignItems:'center',gap:'8px',cursor:'pointer',fontFamily:'inherit'}}>
              <${I} name="bell" size=${14}/>
              <span>${notifPerm==='denied'?'Alerts blocked in browser':'Enable Push Alerts'}</span>
            </button>
          `}
          ${notifPerm==='granted'&&html`
            <div style=${{marginTop:'10px',padding:'8px 12px',background:'rgba(31,217,122,0.06)',border:'1px solid rgba(31,217,122,0.18)',borderRadius:'var(--r-md)',fontSize:'11px',color:'var(--success)',fontWeight:'700',display:'flex',alignItems:'center',gap:'6px'}}>
              <${I} name="bell" size=${13}/><span>Push alerts on</span>
            </div>
          `}
        </div>
      </div>

      <div class="main-view">
        ${tab==='dashboard'&&html`<div style="flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative"><${Dashboard} clients=${clients} multiState=${multiState} stopSound=${stopSound} soundPlaying=${soundPlaying}/></div>`}
        ${tab==='single'&&html`<${SingleLurker}
          clients=${clients}
          rawMessages=${rawMessages}
          alerts=${alerts}
          unreadMap=${unreadMap}
          markAlertsAsRead=${markAlertsAsRead}
          clearAlerts=${clearAlerts}
          reload=${loadData}
          reconnectClient=${reconnectClient}/>`}
        ${tab==='multi'&&html`<${MultiLurker}
          clients=${clients}
          alerts=${alerts}
          markAlertsAsRead=${()=>markAlertsAsRead()}
          clearAlerts=${clearAlerts}
          multiState=${multiState}
          setMultiState=${setMultiState}/>`}
        ${tab==='counter'&&html`<${AutoCounterTab} clients=${clients}/>`}
        ${tab==='beef'&&html`<${AutoBeefTab} clients=${clients}/>`}
        ${tab==='detections'&&html`<${DetectionsTab}
          rawMessages=${rawMessages}
          dmMessages=${dmMessages}
          liveMessages=${liveMessages}
          alerts=${alerts}/>`}
        ${tab==='dms'&&html`<${DMBrowser} clients=${clients} dmMessages=${dmMessages} liveMessages=${liveMessages}/>`}
        ${tab==='settings'&&html`<${Settings}
          config=${config}
          onSave=${saveConfig}
          clients=${clients}
          reload=${loadData}
          stopSound=${stopSound}
          soundPlaying=${soundPlaying}/>`}
      </div>

      <${PrecountBanner} alert=${precountBanner} onDismiss=${()=>{setPrecountBanner(null);lastPrecountRef.current=null;}}/>
    </div>`;
}


// ── connectGatewayFull: captures every MESSAGE_CREATE for live feed ────────
function connectGatewayFull(client,onMessage,onAlert,onStatusChange,onDmMessage,onLiveMessage){
  if(activeGateways.has(client.id)){const _old=activeGateways.get(client.id);if(_old._1803destroy)_old._1803destroy();_old.close();activeGateways.delete(client.id);}
  let hbInterval=null,seq=null,reconnectTimer=null,reconnectDelay=2000,destroyed=false;
  const clientId=client.id;
  const getClient=()=>DB.getClients().find(c=>c.id===clientId)||client;
  // Cache for channel/guild names
  const nameCache=new Map();

  async function resolveChannelMeta(token,channelId,guildId){
    const key=channelId;
    if(nameCache.has(key))return nameCache.get(key);
    let channelName=null,guildName=null;
    try{
      const r=await fetch(`https://discord.com/api/v10/channels/${channelId}`,{headers:{Authorization:token}});
      if(r.ok){const d=await r.json();channelName=d.name||null;guildId=guildId||d.guild_id||null;}
    }catch{}
    if(guildId){
      try{
        const r=await fetch(`https://discord.com/api/v10/guilds/${guildId}`,{headers:{Authorization:token}});
        if(r.ok){const d=await r.json();guildName=d.name||null;}
      }catch{}
    }
    const meta={channelName,guildId,guildName};
    nameCache.set(key,meta);
    return meta;
  }

  function scheduleReconnect(){
    if(destroyed)return;
    clearTimeout(reconnectTimer);
    reconnectTimer=setTimeout(()=>{
      if(destroyed)return;
      const fresh=DB.getClients().find(c=>c.id===clientId);
      if(!fresh)return;
      reconnectDelay=Math.min(reconnectDelay*2,30000);
      connectGatewayFull(fresh,onMessage,onAlert,onStatusChange,onDmMessage,onLiveMessage);
    },reconnectDelay);
  }

  const ws=new WebSocket(GATEWAY);
  activeGateways.set(clientId,ws);
  ws.onopen=()=>{};

  ws.onmessage=(e)=>{
    let payload;
    try{payload=JSON.parse(e.data);}catch{return;}
    const{op,d,s,t}=payload;
    if(s)seq=s;
    if(op===10){
      const interval=d.heartbeat_interval;
      setTimeout(()=>{if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({op:1,d:seq}));},Math.random()*interval);
      hbInterval=setInterval(()=>{if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({op:1,d:seq}));},interval);
      ws.send(JSON.stringify({op:2,d:{token:client.token,capabilities:16381,properties:{os:'Windows',browser:'Chrome',device:''},presence:{status:'invisible',since:0,activities:[],afk:false},compress:false,client_state:{guild_versions:{}}}}));
    }
    if(op===11)return;
    if(op===9){onStatusChange(clientId,false);ws.close();scheduleReconnect();return;}
    if(op===0){
      if(t==='READY'){if(d.user?.id)cacheGatewayUserId(clientId,d.user.id);reconnectDelay=2000;onStatusChange(clientId,true);}
      if(t==='MESSAGE_CREATE'||t==='MESSAGE_UPDATE'){
        const current=getClient();
        const listenCh=current.type==='multi'?(DB.getMulti().globalChannel||''):(current.listenChannelId||'');

        // ── Live feed: capture every MESSAGE_CREATE regardless of channel ─
        if(t==='MESSAGE_CREATE'&&onLiveMessage){
          const isDM=d.guild_id===undefined||d.guild_id===null;
          const isGroup=!d.guild_id&&d.channel?.type===3;
          const liveType=isDM?(isGroup?'group':'dm'):'server';
          // Resolve meta async, then fire live
          (async()=>{
            let channelName=null,guildName=null;
            try{
              const meta=await resolveChannelMeta(current.token,d.channel_id,d.guild_id||null);
              channelName=meta.channelName;guildName=meta.guildName;
            }catch{}
            onLiveMessage({...d,channelId:d.channel_id,channelName,guildId:d.guild_id||null,guildName,clientId,_liveType:liveType});
          })();
        }

        // ── Monitor channel logic (original) ─────────────────────────────
        if(!listenCh||d.channel_id!==listenCh)return;
        if(onDmMessage&&(d.guild_id===undefined||d.guild_id===null)){
          onDmMessage({...d,channelId:d.channel_id,clientId,attachments:(d.attachments||[]).map(a=>typeof a==='string'?{url:a}:a),edited:t==='MESSAGE_UPDATE'});
        }
        const rawTrimmed=(d.content||'').trim();
        const msg={id:d.id,clientId,channelId:d.channel_id,author:d.author?.username||'?',authorId:d.author?.id,content:rawTrimmed,timestamp:d.timestamp,attachments:d.attachments||[],embeds:d.embeds||[],avatarURL:d.author?.avatar?`https://cdn.discordapp.com/avatars/${d.author.id}/${d.author.avatar}.png?size=64`:null,edited:t==='MESSAGE_UPDATE'};
        if(t==='MESSAGE_CREATE'){
          if(!isOwnNodeAuthor(d.author?.id)){
            addSplitBuf(d.author?.id,rawTrimmed);
            if(!DB.getConfig()?.globalSettings?.disableCounting)checkCounting(d.author?.id,d.author?.username||'?',rawTrimmed,d.embeds||[],{id:d.id,isBot:d.author?.bot});
          }
        }
        onMessage(msg);
        const scanText=getMessageScanText(d);
        const num=(!isJunkMessage(scanText))&&extractNumber(scanText);
        if(num!==null&&num!==false&&!DB.getConfig()?.globalSettings?.disableCounting&&!isOwnNodeAuthor(d.author?.id)){
          const dk=`det_${d.channel_id}_${d.author?.id}`;
          if(!detectionDedup.has(dk)){
            detectionDedup.set(dk,Date.now());
            setTimeout(()=>detectionDedup.delete(dk),30000);
            Promise.all([
              fetch(`https://discord.com/api/v10/channels/${d.channel_id}`,{headers:{Authorization:current.token}}).then(r=>r.json()).catch(()=>null),
              fetch(`https://discord.com/api/v10/channels/${d.channel_id}/messages?before=${d.id}&limit=50`,{headers:{Authorization:current.token}}).then(r=>r.json()).catch(()=>null),
            ]).then(([chData,history])=>{
              if(!Array.isArray(history))return;
              if(isOwnNodeAuthor(d.author?.id))return;
              const prev=history.filter(m=>m.author?.id===d.author?.id).find(m=>{const st=getMessageScanText(m);return extractNumber(st)===null;});
              if(!prev)return;
              let dt=prev.content||extractEmbedText(prev.embeds||[])||'[Media]';
              if(prev.attachments?.length)dt+=' [📎]';
              if(prev.embeds?.length&&!prev.content)dt+=' [🔗]';
              onAlert({clientId,type:'precount',author:d.author?.username||'Unknown',authorId:d.author?.id,channelId:d.channel_id,channelName:chData?.name||null,countStart:scanText.slice(0,60),prevMsg:dt,timestamp:new Date().toISOString()});
            }).catch(()=>{});
          }
        }
      }
    }
  };

  ws.onerror=()=>{};
  ws.onclose=()=>{clearInterval(hbInterval);onStatusChange(clientId,false);activeGateways.delete(clientId);scheduleReconnect();};
  ws._1803destroy=()=>{destroyed=true;clearTimeout(reconnectTimer);};
  return ws;
}

// Add pulse animation
const _styleEl=document.createElement('style');
_styleEl.textContent='@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(0.85)}}';
document.head.appendChild(_styleEl);

render(html`<${App}/>`,document.getElementById('root'));
</script>
