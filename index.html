              <div style="display:flex;align-items:center;gap:4px;padding:3px 9px;background:rgba(31,217,122,0.06);border:1px solid rgba(31,217,122,0.15);border-radius:100px">
                <div style="width:4px;height:4px;border-radius:50%;background:var(--success);animation:pulse 2s ease infinite"></div>
                <span style="font-size:9px;font-weight:800;color:var(--success);letter-spacing:1px;text-transform:uppercase">Live</span>
              </div>
            </div>
            <div style="padding:8px">
              ${clients.length===0
                ? html`<div style="text-align:center;padding:48px 0;opacity:0.2">
                    <${I} name="layers" size=${28} style="margin-bottom:10px"/>
                    <p style="font-weight:600;font-size:13px">No nodes connected</p>
                    <p style="font-size:11px;color:var(--text-3);margin-top:3px">Add tokens in Settings.</p>
                  </div>`
                : clients.map(c=>html`
                  <div key=${c.id}
                    style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;margin-bottom:3px;border:1px solid transparent;transition:all .15s"
                    onMouseEnter=${e=>{e.currentTarget.style.background='rgba(255,255,255,0.03)';e.currentTarget.style.borderColor='rgba(255,255,255,0.06)';}}
                    onMouseLeave=${e=>{e.currentTarget.style.background='';e.currentTarget.style.borderColor='transparent';}}>
                    <div style="width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,0.04);flex-shrink:0;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.07)">
                      ${c.avatarURL
                        ? html`<img src=${c.avatarURL} style="width:100%;height:100%;object-fit:cover"/>`
                        : html`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--font-hd);font-size:14px;font-weight:800;color:var(--text-2)">${(c.tag?.split('#')[0]||'?')[0].toUpperCase()}</div>`}
                      <div style=${{position:'absolute',bottom:'-1px',right:'-1px',width:'10px',height:'10px',borderRadius:'50%',background:c.active?'var(--success)':'var(--text-3)',border:'2px solid var(--bg-app)',boxShadow:c.active?'0 0 5px var(--success)':''}}></div>
                    </div>
                    <div style="flex:1;min-width:0">
                      <div style="font-weight:700;font-size:13px;font-family:var(--font-hd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-0)">${c.tag?.split('#')[0]||'Unknown'}</div>
                      <div style="font-size:10px;color:var(--text-3);margin-top:1px;font-family:var(--font-mono)">${c.listenChannelId?'ch: '+c.listenChannelId.slice(0,16):'no channel'}</div>
                    </div>
                    <div style=${{fontSize:'9px',fontWeight:'800',padding:'2px 7px',borderRadius:'4px',textTransform:'uppercase',letterSpacing:'0.8px',background:c.type==='multi'?'var(--accent-soft)':'rgba(255,255,255,0.04)',color:c.type==='multi'?'var(--accent)':'var(--text-3)',border:c.type==='multi'?'1px solid var(--accent-line)':'1px solid rgba(255,255,255,0.06)',marginRight:'4px'}}>
                      ${c.type==='multi'?'Cluster':'Direct'}
                    </div>
                    <div style=${{display:'flex',alignItems:'center',gap:'4px',padding:'3px 8px',borderRadius:'100px',background:c.active?'rgba(31,217,122,0.07)':'rgba(255,255,255,0.03)',border:c.active?'1px solid rgba(31,217,122,0.18)':'1px solid rgba(255,255,255,0.06)'}}>
                      <div style=${{width:'4px',height:'4px',borderRadius:'50%',background:c.active?'var(--success)':'var(--text-3)',boxShadow:c.active?'0 0 4px var(--success)':''}}></div>
                      <span style=${{fontSize:'9px',fontWeight:'800',color:c.active?'var(--success)':'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.8px'}}>${c.active?'Active':'Idle'}</span>
                    </div>
                  </div>
                `)}
            </div>
          </div>

          <!-- Right column -->
          <div style="display:flex;flex-direction:column;gap:12px">

            <!-- System info -->
            <div style="background:rgba(255,255,255,0.015);border:1px solid rgba(255,255,255,0.06);border-radius:16px;overflow:hidden">
              <div style="padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:7px">
                <${I} name="terminal" size=${12} style="color:var(--text-3)"/>
                <span style="font-family:var(--font-hd);font-size:12px;font-weight:700;color:var(--text-1)">System</span>
              </div>
              <div style="padding:10px 14px;display:flex;flex-direction:column;gap:9px">
                ${[
                  {label:'Gateways',val:activeGateways.size+' open'},
                  {label:'Direct nodes',val:clients.filter(c=>c.type==='single').length},
                  {label:'Cluster nodes',val:clients.filter(c=>c.type==='multi').length},
                  {label:'Session',val:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},
                  {label:'Storage',val:'localStorage'},
                ].map(r=>html`
                  <div style="display:flex;align-items:center;justify-content:space-between">
                    <span style="font-size:11px;color:var(--text-3)">${r.label}</span>
                    <span style="font-size:11px;color:var(--text-1);font-weight:700;font-family:var(--font-mono)">${r.val}</span>
                  </div>
                `)}
              </div>
            </div>

            <!-- Health bar -->
            <div style="background:rgba(255,255,255,0.015);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:13px 14px">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
                <span style="font-family:var(--font-hd);font-size:12px;font-weight:700;color:var(--text-1)">Network Health</span>
                <span style=${{fontSize:'14px',fontWeight:'900',fontFamily:'var(--font-hd)',color:health>=80?'var(--success)':health>=40?'var(--warning)':'var(--danger)'}}>${health}%</span>
              </div>
              <div style="height:5px;background:rgba(255,255,255,0.06);border-radius:100px;overflow:hidden;margin-bottom:8px">
                <div style=${{height:'100%',width:health+'%',background:health>=80?'var(--success)':health>=40?'var(--warning)':'var(--danger)',borderRadius:'100px',transition:'width .6s ease',boxShadow:health>=80?'0 0 8px var(--success)':health>=40?'0 0 8px var(--warning)':'0 0 8px var(--danger)'}}></div>
              </div>
              <div style="display:flex;justify-content:space-between">
                <span style="font-size:10px;color:var(--success)">${active} active</span>
                <span style="font-size:10px;color:var(--text-3)">${clients.length-active} idle</span>
              </div>
            </div>

            <!-- Node breakdown -->
            <div style="background:rgba(255,255,255,0.015);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:13px 14px">
              <div style="font-family:var(--font-hd);font-size:12px;font-weight:700;color:var(--text-1);margin-bottom:10px">Node Breakdown</div>
              <div style="display:flex;gap:8px">
                <div style="flex:1;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:9px;padding:10px;text-align:center">
                  <div style="font-family:var(--font-hd);font-size:22px;font-weight:900;color:var(--accent);letter-spacing:-1px">${clients.filter(c=>c.type==='single').length}</div>
                  <div style="font-size:9px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-top:2px;opacity:0.7">Direct</div>
                </div>
                <div style="flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:9px;padding:10px;text-align:center">
                  <div style="font-family:var(--font-hd);font-size:22px;font-weight:900;color:var(--text-1);letter-spacing:-1px">${clients.filter(c=>c.type==='multi').length}</div>
                  <div style="font-size:9px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;margin-top:2px">Cluster</div>
                </div>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>`;
}

function SingleLurker({clients,rawMessages,alerts,unreadMap,markAlertsAsRead,clearAlerts,reload,reconnectClient}){
  const singles=clients.filter(c=>c.type==='single');
  const [selId,setSelId]=useState(null);
  const [tab,setTab]=useState('feed');
  const [ch1,setCh1]=useState('');
  const [msg1,setMsg1]=useState('');
  const [sendResult,setSendResult]=useState(null);
  const [historyMsgs,setHistoryMsgs]=useState({});
  const [loadingHist,setLoadingHist]=useState(false);
  const [noMoreHist,setNoMoreHist]=useState({});
  const [clearedIds,setClearedIds]=useState({}); // per-client set of cleared message ids
  const [userMapping,setUserMapping]=useState(false);
  const [mapBoxes,setMapBoxes]=useState({});
  const [mapChannelInputs,setMapChannelInputs]=useState({});
  const [mapDrafts,setMapDrafts]=useState({});
  const [mapLoadingHist,setMapLoadingHist]=useState({});
  const [dragState,setDragState]=useState(null);
  const msgEnd=useRef(null);
  const feedRef=useRef(null);
  const mapBoardRef=useRef(null);
  const isAutoScroll=useRef(false);
  const mapScrollElsRef=useRef({});
  const mapScrollStateRef=useRef({});
  const mapAutoScrollingRef=useRef(false);
  const mapPrevMsgIdsRef=useRef({});

  const MAP_SCROLL_NEAR=48;
  const mapScrollKey=(clientId,authorId)=>authorId?`${clientId}::${authorId}`:`${clientId}::main`;
  const mapAuthorKey=(m)=>m.authorId||`name:${m.author||'Unknown'}`;
  const isMapNearBottom=(el)=>!el||el.scrollHeight-el.scrollTop-el.clientHeight<=MAP_SCROLL_NEAR;

  const handleMapScroll=(clientId,authorId,e)=>{
    if(mapAutoScrollingRef.current)return;
    const key=mapScrollKey(clientId,authorId);
    mapScrollStateRef.current[key]={scrolledUp:!isMapNearBottom(e.currentTarget)};
  };

  const setMapScrollEl=(clientId,authorId,node)=>{
    const key=mapScrollKey(clientId,authorId);
    if(node)mapScrollElsRef.current[key]=node;
    else delete mapScrollElsRef.current[key];
  };

  const scrollMapToBottom=(clientId,authorId)=>{
    const el=mapScrollElsRef.current[mapScrollKey(clientId,authorId)];
    if(!el)return;
    mapAutoScrollingRef.current=true;
    el.scrollTop=el.scrollHeight;
    requestAnimationFrame(()=>{
      el.scrollTop=el.scrollHeight;
      setTimeout(()=>{mapAutoScrollingRef.current=false;},80);
    });
  };

  const mapKey=singles.map(c=>`${c.id}:${c.listenChannelId||''}`).join('|');

  const buildDefaultMapBoxes=useCallback((list)=>{
    const cols=3;
    return list.reduce((acc,c,idx)=>{
      const col=idx%cols;
      const row=Math.floor(idx/cols);
      acc[c.id]={x:24+col*360,y:24+row*250,w:360,h:420,minimized:false,expanded:false,closed:false,z:idx+1};
      return acc;
    },{});
  },[]);

  useEffect(()=>{
    if(singles.length>0&&!selId){setSelId(singles[0].id);setCh1(singles[0].listenChannelId||'');}
  },[singles.length]);

  useEffect(()=>{
    setMapBoxes(prev=>{
      const defs=buildDefaultMapBoxes(singles);
      const next={};
      singles.forEach(c=>{next[c.id]={...defs[c.id],...(prev[c.id]||{})};});
      return next;
    });
    setMapChannelInputs(prev=>{
      const next={};
      singles.forEach(c=>{
        const cur=prev[c.id];
        next[c.id]=(cur!==undefined&&cur!=='')?cur:(c.listenChannelId||'');
      });
      return next;
    });
  },[mapKey,buildDefaultMapBoxes]);

  useEffect(()=>{
    mapPrevMsgIdsRef.current={};
    mapScrollStateRef.current={};
  },[mapKey]);

  useEffect(()=>{
    if(!userMapping)return;
    singles.forEach(c=>{
      const ch=(mapChannelInputs[c.id]||'').trim()||c.listenChannelId||'';
      if(ch&&!(historyMsgs[c.id]||[]).length&&!mapLoadingHist[c.id])loadMapHistory(c.id);
    });
  },[userMapping,mapKey]);

  useEffect(()=>{
    if(!dragState)return;
    const prevSelect=document.body.style.userSelect;
    document.body.style.userSelect='none';
    const onMove=e=>{
      const dx=e.clientX-dragState.startX;
      const dy=e.clientY-dragState.startY;
      setMapBoxes(prev=>{
        const box=prev[dragState.id];
        if(!box)return prev;
        const board=mapBoardRef.current?.getBoundingClientRect();
        let nx=dragState.origX+dx;
        let ny=dragState.origY+dy;
        if(board){
          const maxX=Math.max(0,board.width-box.w);
          const maxY=Math.max(0,board.height-(box.minimized?46:box.h));
          nx=Math.max(0,Math.min(nx,maxX));
          ny=Math.max(0,Math.min(ny,maxY));
        }else{
          nx=Math.max(0,nx);
          ny=Math.max(0,ny);
        }
        if(nx===box.x&&ny===box.y)return prev;
        return {...prev,[dragState.id]:{...box,x:nx,y:ny}};
      });
    };
    const onUp=()=>setDragState(null);
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{
      document.body.style.userSelect=prevSelect;
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
    };
  },[dragState]);

  const selClient=singles.find(c=>c.id===selId)||singles[0];

  useEffect(()=>{
    if(selClient){setCh1(selClient.listenChannelId||'');}
    setHistoryMsgs({});setNoMoreHist({});
  },[selId]);

  useEffect(()=>{
    if(!feedRef.current||isAutoScroll.current||userMapping)return;
    const el=feedRef.current;
    const near=el.scrollHeight-el.scrollTop-el.clientHeight<120;
    if(near){isAutoScroll.current=true;msgEnd.current?.scrollIntoView({behavior:'smooth'});setTimeout(()=>{isAutoScroll.current=false;},400);}
  },[rawMessages,userMapping]);

  const bringMapBoxToFront=id=>{
    setMapBoxes(prev=>{
      const box=prev[id];
      if(!box)return prev;
      const maxZ=Math.max(0,...Object.values(prev).map(b=>b?.z||0));
      if((box.z||0)>=maxZ)return prev;
      return {...prev,[id]:{...box,z:maxZ+1}};
    });
  };

  const startMapDrag=(e,id)=>{
    if(e.button!==0)return;
    const box=mapBoxes[id];
    if(!box)return;
    bringMapBoxToFront(id);
    setSelId(id);
    setDragState({id,startX:e.clientX,startY:e.clientY,origX:box.x,origY:box.y});
    e.preventDefault();
  };

  const toggleMapMinimize=id=>setMapBoxes(prev=>prev[id]?{...prev,[id]:{...prev[id],minimized:!prev[id].minimized}}:prev);
  const toggleMapBoxExpand=id=>setMapBoxes(prev=>{
    const box=prev[id];
    if(!box)return prev;
    const expanded=!box.expanded;
    return {...prev,[id]:{...box,expanded,h:expanded?560:420}};
  });
  const closeMapBox=id=>setMapBoxes(prev=>prev[id]?{...prev,[id]:{...prev[id],closed:true}}:prev);
  const reopenClosedMapBoxes=()=>setMapBoxes(prev=>{
    const next={...prev};
    Object.keys(next).forEach(id=>{next[id]={...next[id],closed:false};});
    return next;
  });
  const resetMapLayout=()=>setMapBoxes(buildDefaultMapBoxes(singles));

  const setChannel=async()=>{
    if(!selClient||!ch1.trim())return;
    await invoke('set-client-listen-channel',{id:selClient.id,channelId:ch1.trim()});
    reload();
    reconnectClient(selClient.id);
  };

  const setMapChannel=async(id)=>{
    const ch=(mapChannelInputs[id]||'').trim();
    if(!ch)return;
    try{
      await invoke('set-client-listen-channel',{id,channelId:ch});
      if(id===selId)setCh1(ch);
      reload();
      reconnectClient(id);
      toast('Channel synced.','success');
      if(!(historyMsgs[id]||[]).length)loadMapHistory(id);
    }catch{
      toast('Failed to sync channel.','error');
    }
  };

  const getMapDraftKey=(clientId,authorId)=>`${clientId}::${authorId||'unknown'}`;

  const getMapMessages=(clientId)=>{
    const boxCleared=clearedIds[clientId]||new Set();
    const feed=rawMessages[clientId]||[];
    const hist=historyMsgs[clientId]||[];
    return [...hist,...feed].reduce((acc,m)=>{
      if(!acc.find(x=>x.id===m.id)&&!boxCleared.has(m.id))acc.push(m);
      return acc;
    },[]).sort((a,b)=>Date.parse(a.timestamp||0)-Date.parse(b.timestamp||0));
  };

  useEffect(()=>{
    if(!userMapping)return;
    singles.forEach(c=>{
      const msgs=getMapMessages(c.id);
      const prevIds=mapPrevMsgIdsRef.current[c.id]||new Set();
      const isFirstSeed=prevIds.size===0&&msgs.length>0;
      const newMsgs=isFirstSeed?[]:msgs.filter(m=>!prevIds.has(m.id));
      mapPrevMsgIdsRef.current[c.id]=new Set(msgs.map(m=>m.id));

      const scrollIfStuck=(authorId)=>{
        const key=mapScrollKey(c.id,authorId);
        if(!mapScrollStateRef.current[key]?.scrolledUp)scrollMapToBottom(c.id,authorId);
      };

      if(isFirstSeed){
        requestAnimationFrame(()=>{
          scrollIfStuck(null);
          const seenAuthors=new Set();
          msgs.forEach(m=>{
            const aid=mapAuthorKey(m);
            if(seenAuthors.has(aid))return;
            seenAuthors.add(aid);
            scrollIfStuck(aid);
          });
        });
        return;
      }

      if(!newMsgs.length)return;

      const lastOverall=msgs[msgs.length-1];
      const touchedAuthors=new Set();

      newMsgs.forEach(m=>{
        const aid=mapAuthorKey(m);
        const userMsgs=msgs.filter(x=>mapAuthorKey(x)===aid);
        if(userMsgs[userMsgs.length-1]?.id===m.id){
          touchedAuthors.add(aid);
          scrollIfStuck(aid);
        }
      });

      if(lastOverall&&newMsgs.some(m=>m.id===lastOverall.id)){
        requestAnimationFrame(()=>scrollIfStuck(null));
      }
    });
  },[rawMessages,historyMsgs,clearedIds,userMapping,mapKey]);

  const loadMapHistory=async(clientId)=>{
    if(mapLoadingHist[clientId])return;
    const ch=(mapChannelInputs[clientId]||'').trim()||singles.find(c=>c.id===clientId)?.listenChannelId||'';
    const client=singles.find(c=>c.id===clientId);
    if(!ch||!client||noMoreHist[clientId])return;
    setMapLoadingHist(p=>({...p,[clientId]:true}));
    try{
      const oldestId=historyMsgs[clientId]?.[0]?.id;
      const url=`https://discord.com/api/v10/channels/${ch}/messages?limit=100${oldestId?'&before='+oldestId:''}`;
      const res=await fetch(url,{headers:{Authorization:client.token}});
      if(res.ok){
        const batch=await res.json();
        if(!Array.isArray(batch)||!batch.length){setNoMoreHist(p=>({...p,[clientId]:true}));}
        else{
          const normalized=[...batch].reverse().map(m=>({id:m.id,clientId,channelId:ch,author:m.author?.username||'?',authorId:m.author?.id,content:m.content||'',timestamp:m.timestamp,attachments:m.attachments||[],avatarURL:m.author?.avatar?`https://cdn.discordapp.com/avatars/${m.author.id}/${m.author.avatar}.png?size=64`:null}));
          setHistoryMsgs(p=>({...p,[clientId]:[...normalized,...(p[clientId]||[])]}));
          if(batch.length<100)setNoMoreHist(p=>({...p,[clientId]:true}));
        }
      }
    }catch{}
    setMapLoadingHist(p=>({...p,[clientId]:false}));
  };

  const sendMapUserMsg=async(clientId,authorId)=>{
    const draftKey=getMapDraftKey(clientId,authorId);
    const message=(mapDrafts[draftKey]||'').trim();
    if(!message)return;
    const targetChannel=(mapChannelInputs[clientId]||'').trim()||singles.find(c=>c.id===clientId)?.listenChannelId||'';
    if(!targetChannel){toast('Set a channel first.','error');return;}
    const r=await invoke('send-single-message',{clientId,channelId:targetChannel,message});
    if(r?.success){
      setMapDrafts(prev=>({...prev,[draftKey]:''}));
      toast('Message sent.','success');
    }else{
      toast(r?.error||'Failed to send message.','error');
    }
  };

  const sendMsg=async()=>{
    if(!selClient||!msg1.trim())return;
    const tch=ch1.trim()||selClient.listenChannelId;
    if(!tch)return;
    setSendResult(null);
    const m = msg1;
    setMsg1('');
    const r=await invoke('send-single-message',{clientId:selClient.id,channelId:tch,message:m});
    setSendResult(r);
    if(!r?.success)setMsg1(m);
    setTimeout(()=>setSendResult(null),4000);
  };

  const loadHistory=async()=>{
    if(!selClient||loadingHist)return;
    const tch=ch1.trim()||selClient.listenChannelId;
    if(!tch)return;
    setLoadingHist(true);
    try{
      const oldestId=historyMsgs[selId]?.[0]?.id;
      const url=`https://discord.com/api/v10/channels/${tch}/messages?limit=50${oldestId?'&before='+oldestId:''}`;
      const res=await fetch(url,{headers:{Authorization:selClient.token}});
      if(res.ok){
        const batch=await res.json();
        if(!Array.isArray(batch)||!batch.length){setNoMoreHist(p=>({...p,[selId]:true}));}
        else{
          const normalized=[...batch].reverse().map(m=>({id:m.id,clientId:selId,channelId:tch,author:m.author?.username||'?',authorId:m.author?.id,content:m.content||'',timestamp:m.timestamp,attachments:m.attachments||[],avatarURL:m.author?.avatar?`https://cdn.discordapp.com/avatars/${m.author.id}/${m.author.avatar}.png?size=64`:null}));
          setHistoryMsgs(p=>({...p,[selId]:[...normalized,...(p[selId]||[])]}));
          if(batch.length<50)setNoMoreHist(p=>({...p,[selId]:true}));
        }
      }
    }catch{}
    setLoadingHist(false);
  };

  const telAlerts=alerts.filter(a=>(a.type==='multi'||a.type==='detection')&&(!selClient||a.clientId===selClient?.id));

  if(singles.length===0) return html`
    <div class="view-content animate-fade">
      <div class="view-hero">
        <div class="view-hero-inner">
          <h1 class="view-hero-title">Account Monitor</h1>
          <p class="view-hero-sub">Live feed and user mapping for individual lurker accounts.</p>
        </div>
      </div>
      <div class="view-empty" style="margin-top:8px;padding:80px 32px">
        <${I} name="user" size=${44} style="margin-bottom:16px;color:var(--text-3);opacity:.5"/>
        <p style="font-weight:700;font-size:16px;color:var(--text-1);margin-bottom:8px">No direct accounts</p>
        <p style="font-size:13px;color:var(--text-3)">Add a Direct node in Settings to start monitoring.</p>
      </div>
    </div>`;

  const feed=(rawMessages[selId]||[]);
  const cleared=clearedIds[selId]||new Set();

                          <p style="font-size:13px;color:var(--text-3)">Messages in the synced channel appear here in real time.</p>

                          const showDate=!prev||dayKey!==prevDay;
                          const sameAuthor=prev&&(prev.authorId===m.authorId||prev.author===m.author)&&dayKey===prevDay;
                          const compact=sameAuthor;
                          const ts=new Date(m.timestamp);

                      <div class="animate-fade" style=${{marginTop:'12px',padding:'10px 16px',borderRadius:'100px',fontSize:'12px',fontWeight:'600',textAlign:'center',background:sendResult.success?'rgba(31,217,122,.08)':'rgba(255,68,85,.08)',color:sendResult.success?'var(--success)':'var(--danger)',border:sendResult.success?'1px solid rgba(31,217,122,.2)':'1px solid rgba(255,68,85,.2)'}}>

                  </div>`)
            : html`
                <div class="view-content" style="padding:28px">
                  ${telAlerts.length===0
                    ?html`<div class="view-empty">
                        <${I} name="shield" size=${44} style="margin-bottom:16px;color:var(--text-3);opacity:.4"/>
                        <p style="font-weight:700;font-size:15px;color:var(--text-1);margin-bottom:6px">No activity logged</p>

                      </div>`

                      ${telAlerts.map(a=>html`

                          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">

                            <span style="font-size:11px;color:var(--text-3);font-family:var(--font-mono)">${new Date(a.timestamp).toLocaleTimeString()}</span>
                          </div>

                        </div>`)}
                    </div>`}
                </div>`}
        </div>
      </div>
    </div>`;
}

function MultiLurker({clients,alerts,markAlertsAsRead,clearAlerts,multiState,setMultiState}){
  const multi=clients.filter(c=>c.type==='multi');
  const {globalChannel='',sendChannel='',msgContent='',delay=1000}=multiState;
  const [listenMsg,setListenMsg]=useState('');
  const [sending,setSending]=useState(false);
  const [result,setResult]=useState(null);
  const [tab,setTab]=useState('broadcast');

  useEffect(()=>{if(alerts.some(a=>!a.read))markAlertsAsRead();},[alerts.length]);
  useEffect(()=>{const t=setTimeout(()=>{invoke('set-multi-state',multiState);},500);return()=>clearTimeout(t);},[multiState]);

  const handleListen=async()=>{if(!globalChannel)return;await invoke('set-multi-state',multiState);setListenMsg('Monitoring active');setTimeout(()=>setListenMsg(''),4000);};
  const handleSend=async()=>{
    if(!sendChannel||!msgContent)return;
    setSending(true);setResult(null);
    const res=await invoke('send-mass-message',{channelId:sendChannel,message:msgContent,delayMs:delay});
    setSending(false);
    if(res?.success)setResult({success:true,sent:res.sentCount,failed:res.failedCount});
    else setResult({success:false,error:res?.error||'Broadcast failed'});
  };
  const set=(k,v)=>setMultiState(p=>({...p,[k]:v}));
  const filteredAlerts=alerts.filter(a=>a.type==='precount'&&(!globalChannel||a.channelId===globalChannel));

  return html`
    <div class="view-content animate-fade">
      <div class="view-hero">
        <div class="view-hero-inner">
          <h1 class="view-hero-title">Broadcast</h1>
          <p class="view-hero-sub">Mass dispatch to cluster nodes and monitor precount signals across channels.</p>
          <div class="view-stat-row">
            <div class="view-stat-pill"><${I} name="layers" size=${14} style="color:var(--text-3)"/> Cluster nodes <b>${multi.length}</b></div>
            <div class="view-stat-pill"><${I} name="zap" size=${14} style="color:var(--text-3)"/> Alerts <b>${filteredAlerts.length}</b></div>
            ${globalChannel&&html`<div class="view-stat-pill"><${I} name="eye" size=${14} style="color:var(--text-3)"/> Watching <b style="font-family:var(--font-mono);font-size:11px">${globalChannel.slice(0,8)}…</b></div>`}
          </div>
        </div>
      </div>

      <div class="view-tabs">
        <button class=${'view-tab-btn'+(tab==='broadcast'?' active':'')} onClick=${()=>setTab('broadcast')}>
          <${I} name="send" size=${14}/> Mass Dispatch
        </button>
        <button class=${'view-tab-btn'+(tab==='telem'?' active':'')} onClick=${()=>setTab('telem')}>
          <${I} name="activity" size=${14}/> Network Activity
          ${filteredAlerts.some(a=>!a.read)&&html`<span class="view-tab-dot"></span>`}
        </button>
      </div>

      ${tab==='broadcast'?html`
        <div class="view-grid-2">
          <div class="view-panel">
            <div class="view-panel-hdr">
              <div class="view-panel-title">
                <span class="view-panel-icon"><${I} name="sliders" size=${16}/></span>
                Configuration
              </div>
              <span class="view-badge">${multi.length} active</span>
            </div>
            <div class="view-panel-body">
              <div class="inp-group">
                <label class="inp-label">Target Channel ID</label>
                <input class="inp" placeholder="Paste destination channel ID..." value=${sendChannel} onInput=${e=>set('sendChannel',e.target.value)}/>
              </div>
              <div class="inp-group">
                <label class="inp-label">Delay Interval (ms)</label>
                <input class="inp" type="number" value=${delay} onInput=${e=>set('delay',Number(e.target.value))} style="font-family:var(--font-mono)"/>
              </div>
              <div class="inp-group" style="margin-bottom:0">
                <label class="inp-label">Monitoring Channel</label>
                <div style="display:flex;gap:10px">
                  <input class="inp" placeholder="Channel to watch..." value=${globalChannel} onInput=${e=>set('globalChannel',e.target.value)} style="flex:1"/>
                  <button class="btn-secondary" style="width:48px;padding:0;justify-content:center;flex-shrink:0" onClick=${handleListen} title="Start monitoring">
                    <${I} name="eye" size=${18}/>
                  </button>
                </div>
                ${listenMsg&&html`<div class="animate-fade" style="margin-top:10px;font-size:11px;font-weight:700;color:var(--success);display:flex;align-items:center;gap:6px"><${I} name="check" size=${12}/> ${listenMsg}</div>`}
              </div>
            </div>
          </div>

          <div class="view-panel">
            <div class="view-panel-hdr">
              <div class="view-panel-title">
                <span class="view-panel-icon"><${I} name="zap" size=${16}/></span>
                Transmission
              </div>
            </div>
            <div class="view-panel-body">
              <div class="inp-group" style="flex:1;display:flex;flex-direction:column;margin-bottom:0">
                <label class="inp-label">Message Payload</label>
                <textarea class="inp" style="flex:1;min-height:200px;resize:none;line-height:1.55" value=${msgContent} onInput=${e=>set('msgContent',e.target.value)} placeholder="Type the message to broadcast to all cluster nodes..."/>
              </div>
              <button class="btn-primary" style="width:100%;margin-top:22px;justify-content:center;height:52px" onClick=${handleSend} disabled=${sending||!sendChannel||!msgContent}>
                ${sending
                  ?html`<${I} name="loader" size=${18} style="animation:spin 1s linear infinite"/><span style="margin-left:8px">Sending…</span>`
                  :html`<${I} name="send" size=${18}/><span style="margin-left:8px">Execute Broadcast</span>`}
              </button>
              ${result&&html`
                <div class=${'view-result animate-fade '+(result.success?'ok':'err')}>
                  <div style="display:flex;align-items:center;gap:10px">
                    <${I} name=${result.success?'check':'alert'} size=${16} style=${{color:result.success?'var(--success)':'var(--danger)'}}/>
                    <span style=${{fontWeight:'700',fontSize:'13px',color:result.success?'var(--success)':'var(--danger)'}}>${result.success?'Execution complete':'Execution failed'}</span>
                  </div>
                  <p style="font-size:12px;color:var(--text-2);padding-left:26px;line-height:1.5">
                    ${result.success?`Sent to ${result.sent} accounts · ${result.failed} failed`:result.error}
                  </p>
                </div>`}
            </div>
          </div>
        </div>`
      :html`
        <div class="view-panel">
          <div class="view-panel-hdr">
            <div class="view-panel-title">
              <span class="view-panel-icon"><${I} name="activity" size=${16}/></span>
              Network Activity Log
            </div>
            <button class="btn-secondary" style="padding:8px 14px;font-size:12px" onClick=${()=>clearAlerts(null,globalChannel)}>
              <${I} name="trash" size=${14} style="margin-right:6px"/> Clear
            </button>
          </div>
          <div class="view-panel-body" style="max-height:640px;overflow-y:auto;padding-top:16px">
            ${filteredAlerts.length===0
              ?html`<div class="view-empty">
                  <${I} name="activity" size=${44} style="margin-bottom:16px;color:var(--text-3);opacity:.4"/>
                  <p style="font-weight:700;font-size:15px;color:var(--text-1);margin-bottom:6px">No activity yet</p>
                  <p style="font-size:13px;color:var(--text-3)">Precount signals will appear here when detected.</p>
                </div>`
              :html`<div>
                  ${filteredAlerts.map(a=>html`
                    <div class="alert-log-item" key=${a.id}>
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px">
                        <div style="display:flex;align-items:center;gap:10px;min-width:0">
                          <span style="font-weight:700;font-size:14px;color:var(--text-0);font-family:var(--font-hd)">${a.author}</span>
                          <span style="font-size:11px;color:var(--text-3);font-family:var(--font-mono);flex-shrink:0">${new Date(a.timestamp).toLocaleTimeString()}</span>
                        </div>
                        ${(a.channelName||a.channelId)&&html`<span style="font-size:10px;color:var(--warning);font-weight:800;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0">#${a.channelName||a.channelId}</span>`}
                      </div>
                      <div style="font-size:13px;color:var(--text-2);line-height:1.6;padding-left:14px;border-left:2px solid var(--accent-line)"
                        dangerouslySetInnerHTML=${{__html: esc(a.prevMsg)}}/>
                    </div>`)}
                </div>`}
          </div>
        </div>`}
    </div>`;
}

function Settings({config,onSave,clients,reload,stopSound,soundPlaying}){
  const gs=config?.globalSettings||{};
  const [soundUrl,setSoundUrl]=useState(gs.alertSoundUrl||'');
  const [volume,setVolume]=useState(gs.alertVolume!=null?gs.alertVolume:1.0);
  const [disableCounting,setDisableCounting]=useState(gs.disableCounting||false);
  const [saved,setSaved]=useState('');
  const [showAdd,setShowAdd]=useState(false);
  const [token,setToken]=useState('');
  const [type,setType]=useState('single');
  const [adding,setAdding]=useState(false);
  const [addErr,setAddErr]=useState('');
  const fileRef=useRef(null);

  useEffect(()=>{
    const g=config?.globalSettings||{};
    setSoundUrl(g.alertSoundUrl||'');
    setVolume(g.alertVolume!=null?g.alertVolume:1.0);
    setDisableCounting(g.disableCounting||false);
  },[config]);

  const save=(key,val)=>{
    const next={...config,globalSettings:{...(config?.globalSettings||{}),[key]:val}};
    onSave(next);setSaved(key);setTimeout(()=>setSaved(''),2000);
  };

  const saveMulti=(obj)=>{
    const next={...config,globalSettings:{...(config?.globalSettings||{}),...obj}};
    onSave(next);setSaved('multi');setTimeout(()=>setSaved(''),2000);
  };

  const handleFileUpload=(e)=>{
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const dataUrl=ev.target.result;
      setSoundUrl(dataUrl);
      save('alertSoundUrl',dataUrl);
    };
    reader.readAsDataURL(file);
  };

  const add=async()=>{
    if(!token.trim())return;
    setAdding(true);setAddErr('');
    const res=await invoke('add-token',{token:token.trim(),type});
    setAdding(false);
    if(res?.error){setAddErr(res.error);return;}
    setToken('');setShowAdd(false);reload();
  };

  const remove=async(id)=>{
    if(!confirm('Permanently remove this account?'))return;
    await invoke('remove-token',id);reload();
  };

  const [expandedAccount,setExpandedAccount]=useState(null);
  const [revealedFields,setRevealedFields]=useState({});
  const [copiedField,setCopiedField]=useState(null);
  const [fetchedData,setFetchedData]=useState({}); // id -> {email,username} fetched live

  const openAccount=async(c)=>{
    const next=expandedAccount===c.id?null:c.id;
    setExpandedAccount(next);
    if(next&&!fetchedData[c.id]){
      try{
        const r=await fetch('https://discord.com/api/v10/users/@me',{headers:{Authorization:c.token}});
        if(r.ok){
          const me=await r.json();
          const d=me.discriminator&&me.discriminator!=='0'?`#${me.discriminator}`:'';
          const tag=`${me.username}${d}`;
          const email=me.email||null;
          const phone=me.phone||null;
          if(email||phone){
            const up=DB.getClients().map(x=>x.id===c.id?{...x,email:email||x.email,phone:phone||x.phone,tag}:x);
            DB.setClients(up);
          }
          setFetchedData(p=>({...p,[c.id]:{email:email||c.email||null,phone:phone||c.phone||null,username:tag||c.tag||''}}));
        } else {
          setFetchedData(p=>({...p,[c.id]:{email:c.email||null,phone:c.phone||null,username:c.tag||''}}));
        }
      }catch{
        setFetchedData(p=>({...p,[c.id]:{email:c.email||null,phone:c.phone||null,username:c.tag||''}}));
      }
    }
  };
  const toggleReveal=(id,field)=>{
    setRevealedFields(p=>({...p,[id+field]:!p[id+field]}));
  };
  const copyField=(id,field,val)=>{
    navigator.clipboard.writeText(val||'').then(()=>{
      setCopiedField(id+field);setTimeout(()=>setCopiedField(null),2000);
    }).catch(()=>{
      const ta=document.createElement('textarea');ta.value=val||'';ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch{}document.body.removeChild(ta);
      setCopiedField(id+field);setTimeout(()=>setCopiedField(null),2000);
    });
  };

  const directCount=clients.filter(c=>c.type==='single').length;
  const clusterCount=clients.filter(c=>c.type==='multi').length;
  const onlineCount=clients.filter(c=>c.active).length;

  return html`
    <div class="view-content animate-fade">
      <div class="settings-hero">
        <div class="settings-hero-inner">
          <h1 class="settings-hero-title">Settings</h1>
          <p class="settings-hero-sub">Manage connected nodes, alert audio, and detection behavior. Everything stays on this device.</p>
          <div class="settings-stat-row">
            <div class="settings-stat-pill"><${I} name="user" size=${14} style="color:var(--text-3)"/> Nodes <b>${clients.length}</b></div>
            <div class="settings-stat-pill"><${I} name="target" size=${14} style="color:var(--text-3)"/> Direct <b>${directCount}</b></div>
            <div class="settings-stat-pill"><${I} name="layers" size=${14} style="color:var(--text-3)"/> Cluster <b>${clusterCount}</b></div>
            <div class="settings-stat-pill"><span style="width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success)"></span> Online <b>${onlineCount}</b></div>
          </div>
        </div>
      </div>

      <div class="settings-grid">
        <div class="settings-col">
          <div class="settings-panel">
            <div class="settings-panel-hdr">
              <div class="settings-panel-title">
                <span class="settings-panel-icon"><${I} name="user" size=${16}/></span>
                Connected Nodes
              </div>
              <button class="btn-primary" onClick=${()=>setShowAdd(true)} style="padding:8px 18px;font-size:12px">
                <${I} name="plus" size=${15}/> Add Node
              </button>
            </div>
            <div class="settings-panel-body">
              ${clients.length===0
                ? html`<div class="settings-empty">
                    <${I} name="users" size=${40} style="margin-bottom:14px;color:var(--text-3);opacity:.5"/>
                    <p style="font-weight:700;font-size:15px;color:var(--text-1);margin-bottom:6px">No nodes connected</p>
                    <p style="font-size:13px;color:var(--text-3);margin-bottom:20px;line-height:1.5">Add a Discord token to start monitoring channels.</p>
                    <button class="btn-primary" onClick=${()=>setShowAdd(true)} style="margin:0 auto">
                      <${I} name="plus" size=${16}/> Add your first node
                    </button>
                  </div>`
                : html`<div class="settings-account-list">
                    ${clients.map(c=>html`
                      <div key=${c.id} class=${'settings-account-item'+(expandedAccount===c.id?' open':'')}>
                        <button class="settings-account-trigger" onClick=${()=>openAccount(c)}>
                          <div class="settings-avatar">
                            ${c.avatarURL
                              ? html`<img src=${c.avatarURL} style="width:100%;height:100%;object-fit:cover"/>`
                              : html`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--font-hd);font-size:16px;font-weight:800;color:var(--text-2)">${(c.tag?.split('#')[0]||'?')[0].toUpperCase()}</div>`}
                            <span class="settings-avatar-dot" style=${{background:c.active?'var(--success)':'var(--text-3)'}}></span>
                          </div>
                          <div style="flex:1;min-width:0">
                            <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-0)">${c.tag?.split('#')[0]||'Unknown'}</div>
                            <div style="display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap">
                              <span class=${'settings-badge '+(c.type==='multi'?'settings-badge-cluster':'settings-badge-direct')}>${c.type==='multi'?'Cluster':'Direct'}</span>
                              <span style="font-size:11px;color:${c.active?'var(--success)':'var(--text-3)'};font-weight:600">${c.active?'Online':'Offline'}</span>
                            </div>
                          </div>
                          <svg class="settings-expand" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </button>
                        ${expandedAccount===c.id&&html`
                          <div class="settings-account-detail">
                            ${(()=>{
                              const fd=fetchedData[c.id];
                              const loading=!fd;
                              const rows=[
                                {field:'username',label:'Username',val:fd?fd.username:(c.tag?.split('#')[0]||c.tag||''),plain:true},
                                {field:'email',label:'Email',val:fd?fd.email||'':(c.email||''),plain:false},
                                {field:'phone',label:'Phone',val:fd?fd.phone||'':(c.phone||''),plain:false},
                                {field:'token',label:'Token',val:c.token||'',plain:false},
                              ];
                              return loading
                                ? html`<div style="text-align:center;padding:20px 0;color:var(--text-3);font-size:12px;display:flex;align-items:center;justify-content:center;gap:8px">
                                    <${I} name="loader" size=${14} style="animation:spin 1s linear infinite"/>
                                    Fetching account data…
                                  </div>`
                                : rows.map(({field,label,val,plain})=>{
                                    const revealed=plain||revealedFields[c.id+field];
                                    const copied=copiedField===c.id+field;
                                    const display=revealed?val:(val?'•'.repeat(Math.min(val.length,28)):'');
                                    return html`
                                      <div class="settings-field" key=${field}>
                                        <div class="settings-field-label">${label}</div>
                                        <div style="display:flex;align-items:center;gap:8px">
                                          <span style=${{flex:1,fontFamily:'var(--font-mono)',fontSize:'12px',color:val?'var(--text-1)':'var(--text-3)',wordBreak:'break-all',letterSpacing:revealed?'normal':'2px'}}>
                                            ${display||html`<span style="color:var(--text-3);font-style:italic;letter-spacing:normal">Not available</span>`}
                                          </span>
                                          ${val&&!plain&&html`
                                            <button onClick=${()=>toggleReveal(c.id,field)}
                                              style=${{flexShrink:0,width:'30px',height:'30px',borderRadius:'8px',background:'var(--bg-hover)',border:'1px solid var(--border-soft)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'var(--text-2)'}}
                                              title=${revealed?'Hide':'Reveal'}>
                                              <${I} name=${revealed?'eyeoff':'eye'} size=${13}/>
                                            </button>
                                          `}
                                          ${val&&html`
                                            <button onClick=${()=>copyField(c.id,field,val)}
                                              style=${{flexShrink:0,width:'30px',height:'30px',borderRadius:'8px',background:copied?'rgba(31,217,122,0.1)':'var(--bg-hover)',border:copied?'1px solid rgba(31,217,122,0.3)':'1px solid var(--border-soft)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:copied?'var(--success)':'var(--text-2)'}}
                                              title="Copy">
                                              <${I} name=${copied?'check':'copy'} size=${13}/>
                                            </button>
                                          `}
                                        </div>
                                      </div>`;
                                  });
                            })()}
                            <button class="btn-danger" style="width:100%;justify-content:center;height:38px;font-size:12px;margin-top:6px" onClick=${()=>remove(c.id)}>
                              <${I} name="trash" size=${13} style="margin-right:6px"/> Remove Node
                            </button>
                          </div>
                        `}
                      </div>
                    `)}
                  </div>`}
            </div>
          </div>

          <div class="settings-panel settings-danger-panel">
            <div class="settings-panel-hdr">
              <div class="settings-panel-title" style="color:var(--danger)">
                <span class="settings-panel-icon" style="background:rgba(255,68,85,.1);border-color:rgba(255,68,85,.25);color:var(--danger)"><${I} name="alert" size=${16}/></span>
                Danger Zone
              </div>
            </div>
            <div class="settings-panel-body">
              <p style="font-size:13px;color:var(--text-2);margin-bottom:20px;line-height:1.65">Permanently wipes all tokens, cached messages, and preferences from this browser. This cannot be undone.</p>
              <button class="btn-danger" style="width:100%;justify-content:center;height:48px" onClick=${()=>{if(confirm('Wipe all data? This cannot be undone.')){localStorage.clear();location.reload();}}}>
                <${I} name="trash" size=${16}/> Factory Reset
              </button>
            </div>
          </div>
        </div>

        <div class="settings-col">
          <div class="settings-panel">
            <div class="settings-panel-hdr">
              <div class="settings-panel-title">
                <span class="settings-panel-icon"><${I} name="sliders" size=${16}/></span>
                Preferences
              </div>
            </div>
            <div class="settings-panel-body">
              <div class="settings-pref-section">
                <div class="settings-pref-hdr">
                  <${I} name="bell" size=${14} style="color:var(--accent)"/>
                  <span>Alert Audio</span>
                </div>
                <div class="inp-group" style="margin-bottom:16px">
                  <label class="inp-label">Audio Source</label>
                  <div style="display:flex;gap:10px;align-items:center">
                    <input class="inp" placeholder="URL to MP3/WAV (optional)..." value=${soundUrl.startsWith('data:')?'[Uploaded file]':soundUrl}
                      onInput=${e=>{if(!e.target.value){setSoundUrl('');save('alertSoundUrl','');}else{setSoundUrl(e.target.value);}}}
                      onBlur=${e=>{if(!e.target.value.startsWith('['))save('alertSoundUrl',e.target.value);}}
                      style="font-family:var(--font-mono);font-size:12px;flex:1"/>
                    <button class="btn-secondary" style="padding:10px 14px;font-size:12px;white-space:nowrap;flex-shrink:0" onClick=${()=>fileRef.current?.click()}>
                      <${I} name="layers" size=${14} style="margin-right:6px"/> Upload
                    </button>
                  </div>
                  <input ref=${fileRef} type="file" accept=".mp3,.wav,.ogg,.m4a,audio/*" style="display:none" onChange=${handleFileUpload}/>
                  <p style="font-size:11px;color:var(--text-3);margin-top:8px;line-height:1.45">Leave empty for the built-in beep. Upload MP3 or WAV to override.</p>
                </div>
                <div class="inp-group" style="margin-bottom:16px">
                  <label class="inp-label" style="display:flex;justify-content:space-between;align-items:center">
                    <span>Volume</span>
                    <span style=${{fontFamily:'var(--font-mono)',fontSize:'12px',fontWeight:'700',color:volume>1?'var(--warning)':'var(--text-0)',padding:'3px 10px',background:'var(--bg-void)',borderRadius:'6px',border:'1px solid var(--border-soft)'}}>${Math.round(volume*100)}%</span>
                  </label>
                  <div style="padding:14px 16px;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:var(--r-lg)">
                    <div class="vol-slider">
                      <div class="vol-slider-track"></div>
                      <div class=${'vol-slider-fill'+(volume>1?' is-boost':'')} style=${{width:(volume/3*100)+'%'}}></div>
                      <input type="range" class=${'vol-slider-input'+(volume>1?' is-boost':'')} min="0" max="3" step="0.05" value=${volume}
                        onInput=${e=>{const v=parseFloat(e.target.value);setVolume(v);save('alertVolume',v);}}/>
                    </div>
                    <div class="vol-slider-labels">
                      <span>0%</span>
                      <span>100%</span>
                      <span class="boost">300%</span>
                    </div>
                  </div>
                  ${volume>1&&html`<p style="font-size:11px;color:var(--warning);margin-top:10px;font-weight:600">Boosted — audio may distort</p>`}
                </div>
                <div class="inp-group" style="margin-bottom:0">
                  <label class="inp-label">Playback</label>
                  ${soundPlaying
                    ? html`<button class="btn-danger" style="width:100%;justify-content:center;height:44px" onClick=${stopSound}>
                        <${I} name="power" size=${16} style="margin-right:8px"/> Stop Alert Sound
                      </button>`
                    : html`<div style="padding:14px;background:var(--bg-void);border-radius:var(--r-md);border:1px solid var(--border-soft);text-align:center;font-size:13px;color:var(--text-3)">No alert playing</div>`}
                </div>
              </div>

              <div class="settings-toggle-row">
                <div>
                  <div style="font-weight:700;font-size:14px;color:var(--text-0);margin-bottom:4px">Counting Detection</div>
                  <div style="font-size:12px;color:var(--text-3);line-height:1.5">Alert when tokens count in monitored channels.</div>
                </div>
                <button onClick=${()=>{const next=!disableCounting;setDisableCounting(next);save('disableCounting',next);}}
                  style=${{width:'50px',height:'28px',borderRadius:'100px',background:!disableCounting?'var(--success)':'var(--text-3)',border:'none',cursor:'pointer',position:'relative',transition:'background .2s',flexShrink:0}}>
                  <span style=${{position:'absolute',top:'3px',width:'22px',height:'22px',borderRadius:'50%',background:'#fff',transition:'left .2s',left:!disableCounting?'25px':'3px',boxShadow:'0 1px 4px rgba(0,0,0,.3)'}}></span>
                </button>
              </div>

              ${saved&&html`<div class="settings-saved"><${I} name="check" size=${14}/> Saved</div>`}
            </div>
          </div>
        </div>
      </div>

      ${showAdd&&html`
        <div class="modal-overlay" onClick=${()=>setShowAdd(false)}>
          <div class="modal-content animate-fade" onClick=${e=>e.stopPropagation()} style="max-width:440px">
            <div class="settings-modal-icon"><${I} name="key" size=${22}/></div>
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px">
              <div>
                <h2 style="font-family:var(--font-hd);font-size:22px;font-weight:800;margin-bottom:4px">Add Node</h2>
                <p style="font-size:13px;color:var(--text-3)">Connect a Discord account to the lurker.</p>
              </div>
              <button onClick=${()=>setShowAdd(false)} style="color:var(--text-3);width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg-hover);border-radius:10px;border:1px solid var(--border-soft);flex-shrink:0">
                <${I} name="x" size=${18}/>
              </button>
            </div>
            <div class="inp-group">
              <label class="inp-label">Discord Token</label>
              <input class="inp" type="password" placeholder="Paste authorization token..."
                value=${token}
                onInput=${e=>{setToken(e.target.value);setAddErr('');}}/>
              <p style="font-size:11px;color:var(--text-3);margin-top:8px;line-height:1.45">Stored locally only — never sent to external servers.</p>
            </div>
            <div class="inp-group">
              <label class="inp-label">Mode</label>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                <button class="btn-secondary" onClick=${()=>setType('single')} style=${{justifyContent:'center',height:'44px',borderColor:type==='single'?'var(--accent-line)':'var(--border-soft)',background:type==='single'?'var(--accent-soft)':'var(--bg-app)',color:type==='single'?'var(--text-0)':'var(--text-2)'}}>
                  <${I} name="target" size=${14} style="margin-right:6px"/> Direct
                </button>
                <button class="btn-secondary" onClick=${()=>setType('multi')} style=${{justifyContent:'center',height:'44px',borderColor:type==='multi'?'var(--accent-line)':'var(--border-soft)',background:type==='multi'?'var(--accent-soft)':'var(--bg-app)',color:type==='multi'?'var(--text-0)':'var(--text-2)'}}>
                  <${I} name="layers" size=${14} style="margin-right:6px"/> Cluster
                </button>
              </div>
            </div>
            ${addErr&&html`<div style="margin-bottom:20px;padding:14px;background:rgba(255,68,85,.08);color:var(--danger);border-radius:var(--r-md);font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,68,85,.2)">
              <${I} name="alert" size=${16}/> ${addErr}
            </div>`}
            <button class="btn-primary" style="width:100%;justify-content:center;height:50px;margin-top:4px" onClick=${add} disabled=${adding||!token.trim()}>
              ${adding
                ?html`<${I} name="loader" size=${18} style="animation:spin 1s linear infinite"/><span style="margin-left:10px">Connecting…</span>`
                :html`<${I} name="zap" size=${18}/><span style="margin-left:10px">Connect Node</span>`}
            </button>
          </div>
        </div>
      `}
    </div>`;
}

function normalizeAttachments(atts){if(!Array.isArray(atts))return[];return atts.map(a=>typeof a==='string'?{url:a}:a);}
function embedImages(embeds){if(!Array.isArray(embeds))return[];const urls=[];for(const e of embeds){if(e.image?.url)urls.push(e.image.url);if(e.thumbnail?.url)urls.push(e.thumbnail.url);if(e.video?.url)urls.push(e.video.url);}return urls;}
function normalizeMsg(m){return{...m,attachments:normalizeAttachments(m.attachments),_embedImages:embedImages(m.embeds)};}

// ── Live message feed for the messages tab ────────────────────────────────
// allLiveMessages is an array held in App state:
// { id, channelId, channelName, guildId, guildName, author, avatarURL, content, timestamp, attachments, type }
// type: 'dm' | 'group' | 'server'

function DMBrowser({clients, dmMessages, liveMessages}){
  const [dmTab,setDmTab]=useState('dms');
  const [loading,setLoading]=useState(false);
  const [items,setItems]=useState([]);
  const [selectedItem,setSelectedItem]=useState(null);
  const [channels,setChannels]=useState([]);
  const [selectedChannel,setSelectedChannel]=useState(null);
  const [chatMessages,setChatMessages]=useState([]);
  const [chatLoading,setChatLoading]=useState(false);
  const [sending,setSending]=useState(false);
  const [sendStatus,setSendStatus]=useState('');
  const [tokenId,setTokenId]=useState(clients[0]?.id||'');
  const [resolvedAvatars,setResolvedAvatars]=useState({});
  const [noMoreMessages,setNoMoreMessages]=useState(false);
  const [loadingOlder,setLoadingOlder]=useState(false);
  const [showScrollBtn,setShowScrollBtn]=useState(false);
  const [copiedId,setCopiedId]=useState(false);

  const activeToken=clients.find(c=>c.id===tokenId)||clients[0];
  const activeChannelId=selectedChannel?.id||(dmTab!=='servers'?selectedItem?.id:null);
  const showChat=activeChannelId&&(dmTab!=='servers'||selectedChannel);
  const showServerChannels=dmTab==='servers'&&selectedItem&&!selectedChannel;

  const msgEndRef=useRef(null);
  const inputRef=useRef(null);
  const sentMsgIds=useRef(new Set());
  const mergedMsgIds=useRef(new Set());
  const msgsAreaRef=useRef(null);
  const dmUserScrolledUp=useRef(false);
  const dmAutoScrolling=useRef(false);
  const dmPrevMsgCount=useRef(0);
  const chatMessagesRef=useRef([]);
  const noMoreMessagesRef=useRef(false);
  const loadingOlderRef=useRef(false);
  const loadOlderRef=useRef(null);
  const scrollListenerRef=useRef(null);

  useEffect(()=>{
    clients.forEach(async(c)=>{
      if(resolvedAvatars[c.id]!==undefined)return;
      if(c.avatarURL){setResolvedAvatars(p=>({...p,[c.id]:c.avatarURL}));return;}
      try{const r=await fetch('https://discord.com/api/v10/users/@me',{headers:{Authorization:c.token}});if(r.ok){const me=await r.json();const url=me.avatar?`https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png?size=64`:null;setResolvedAvatars(p=>({...p,[c.id]:url||''}));const stored=DB.getClients().map(x=>x.id===c.id?{...x,avatarURL:url||null}:x);DB.setClients(stored);}}catch{}
    });
  },[clients.map(c=>c.id).join(',')]);

  useEffect(()=>{if(!activeToken)return;fetchList();},[dmTab,tokenId]);

  async function fetchList(){
    if(!activeToken)return;
    loadingForRef.current=null;
    setLoading(true);setItems([]);setSelectedItem(null);setSelectedChannel(null);setChatMessages([]);
    try{
      if(dmTab==='dms'||dmTab==='groups'){
        const r=await fetch('https://discord.com/api/v10/users/@me/channels',{headers:{Authorization:activeToken.token}});
        if(!r.ok){setLoading(false);return;}
        const data=await r.json();
        setItems(dmTab==='dms'?data.filter(c=>c.type===1):data.filter(c=>c.type===3));
      }else if(dmTab==='servers'){
        const r=await fetch('https://discord.com/api/v10/users/@me/guilds',{headers:{Authorization:activeToken.token}});
        if(!r.ok){setLoading(false);return;}
        setItems(await r.json());
      }
    }catch{}
    setLoading(false);
  }

  const loadingForRef=useRef(null);

  async function openItem(item){
    loadingForRef.current=item.id;
    setSelectedItem(item);setSelectedChannel(null);setChatMessages([]);
    mergedMsgIds.current.clear();
    if(inputRef.current)inputRef.current.value='';
    sentMsgIds.current.clear();
    if(dmTab==='servers'){
      setChatLoading(true);
      try{const r=await fetch(`https://discord.com/api/v10/guilds/${item.id}/channels`,{headers:{Authorization:activeToken.token}});if(r.ok){const data=await r.json();setChannels(data.filter(c=>c.type===0).sort((a,b)=>a.position-b.position));}}catch{}
      setChatLoading(false);
    }else{loadMessages(item.id);}
  }

  async function openChannel(ch){loadingForRef.current=ch.id;setSelectedChannel(ch);setChatMessages([]);mergedMsgIds.current.clear();if(inputRef.current)inputRef.current.value='';sentMsgIds.current.clear();loadMessages(ch.id);}

  const setMsgsArea=useCallback((node)=>{
    if(scrollListenerRef.current)msgsAreaRef.current?.removeEventListener('scroll',scrollListenerRef.current);
    msgsAreaRef.current=node;
    if(!node)return;
    const onScroll=()=>{if(dmAutoScrolling.current)return;const dist=node.scrollHeight-node.scrollTop-node.clientHeight;dmUserScrolledUp.current=dist>80;setShowScrollBtn(dist>80);if(node.scrollTop<200)loadOlderRef.current?.();};
    scrollListenerRef.current=onScroll;
    node.addEventListener('scroll',onScroll,{passive:true});
  },[]);

  const dmScrollToBottom=()=>{dmUserScrolledUp.current=false;setShowScrollBtn(false);dmAutoScrolling.current=true;msgEndRef.current?.scrollIntoView({behavior:'instant'});setTimeout(()=>{dmAutoScrolling.current=false;},100);};

  async function loadMessages(channelId){
    if(!activeToken)return;
    dmUserScrolledUp.current=false;setShowScrollBtn(false);dmPrevMsgCount.current=0;
    // Only show buffered messages if we're still loading for this channel
    if(loadingForRef.current===channelId){
      const buffered=(dmMessages?.[channelId]||[]).map(m=>({...m,attachments:normalizeAttachments(m.attachments)}));
      if(buffered.length>0)setChatMessages(buffered);
    }
    setChatLoading(true);setNoMoreMessages(false);
    try{
      const r=await fetch(`https://discord.com/api/v10/channels/${channelId}/messages?limit=100`,{headers:{Authorization:activeToken.token}});
      if(r.ok){const batch=await r.json();const norm=[...batch].reverse().map(normalizeMsg);
        // Guard: only update if this channel is still the one being viewed
        if(loadingForRef.current===channelId){
          setChatMessages(prev=>{const ids=new Set(norm.map(m=>m.id));const live=prev.filter(m=>!ids.has(m.id));return[...norm,...live];});
          if(batch.length<100)setNoMoreMessages(true);
        }
      }
    }catch{}
    if(loadingForRef.current===channelId)setChatLoading(false);
    else setChatLoading(false);
    requestAnimationFrame(()=>{dmAutoScrolling.current=true;msgEndRef.current?.scrollIntoView({behavior:'instant'});setTimeout(()=>{dmAutoScrolling.current=false;},100);});
  }

  async function loadOlderMessages(channelId){
    if(!activeToken||loadingOlderRef.current||noMoreMessagesRef.current)return;
    setLoadingOlder(true);loadingOlderRef.current=true;
    try{
      const area=msgsAreaRef.current;const sb=area?area.scrollHeight-area.scrollTop:0;
      const oldId=chatMessagesRef.current[0]?.id;if(!oldId){setLoadingOlder(false);loadingOlderRef.current=false;return;}
      const r=await fetch(`https://discord.com/api/v10/channels/${channelId}/messages?limit=100&before=${oldId}`,{headers:{Authorization:activeToken.token}});
      if(r.ok){const batch=await r.json();if(!Array.isArray(batch)||!batch.length){setNoMoreMessages(true);}else{const pre=[...batch].reverse().map(normalizeMsg);setChatMessages(prev=>{const ids=new Set(prev.map(m=>m.id));const fresh=pre.filter(m=>!ids.has(m.id));return[...fresh,...prev];});if(batch.length<100)setNoMoreMessages(true);requestAnimationFrame(()=>{if(area)area.scrollTop=area.scrollHeight-sb;});}}
    }catch{}
    setLoadingOlder(false);loadingOlderRef.current=false;
  }

  function getDmName(item){if(item.name)return item.name;if(item.recipients?.length)return item.recipients.map(r=>r.username).join(', ');return 'Direct Message';}
  function getDmAvatar(item){if(item.icon)return`https://cdn.discordapp.com/channel-icons/${item.id}/${item.icon}.png?size=64`;if(item.recipients?.length===1&&item.recipients[0].avatar)return`https://cdn.discordapp.com/avatars/${item.recipients[0].id}/${item.recipients[0].avatar}.png?size=64`;return null;}
  function getServerIcon(item){if(item.icon)return`https://cdn.discordapp.com/icons/${item.id}/${item.icon}.png?size=64`;return null;}

  useEffect(()=>{chatMessagesRef.current=chatMessages;noMoreMessagesRef.current=noMoreMessages;loadingOlderRef.current=loadingOlder;loadOlderRef.current=()=>loadOlderMessages(activeChannelId);});

  useEffect(()=>{
    if(!activeChannelId)return;
    const live=dmMessages?.[activeChannelId]||[];if(!live.length)return;
    setChatMessages(prev=>{
      const ids=new Set(prev.map(m=>m.id));
      const fresh=live.filter(m=>!ids.has(m.id)&&!sentMsgIds.current.has(m.id)&&!mergedMsgIds.current.has(m.id)).map(m=>({...m,attachments:normalizeAttachments(m.attachments),_embedImages:embedImages(m.embeds||[])}));
      if(!fresh.length)return prev;
      fresh.forEach(m=>mergedMsgIds.current.add(m.id));
      return[...prev,...fresh];
    });
  },[dmMessages,activeChannelId]);

  useEffect(()=>{
    const count=chatMessages.length;if(!count||loadingOlder||dmUserScrolledUp.current&&dmPrevMsgCount.current>0)return;
    dmAutoScrolling.current=true;msgEndRef.current?.scrollIntoView({behavior:'instant'});setTimeout(()=>{dmAutoScrolling.current=false;},100);dmPrevMsgCount.current=count;
  },[chatMessages.length]);


  async function sendMessage(){
    const targetId=selectedChannel?.id||selectedItem?.id;
    const text=inputRef.current?.value?.trim();
    if(!targetId||!text||!activeToken)return;
    setSending(true);setSendStatus('');
    if(inputRef.current)inputRef.current.value='';
    try{
      const r=await fetch(`https://discord.com/api/v10/channels/${targetId}/messages`,{method:'POST',headers:{Authorization:activeToken.token,'Content-Type':'application/json'},body:JSON.stringify({content:text})});
      if(r.ok){const nm=await r.json();sentMsgIds.current.add(nm.id);setChatMessages(p=>{if(p.some(m=>m.id===nm.id))return p;return[...p,{...nm,attachments:(nm.attachments||[]).map(a=>typeof a==='string'?{url:a}:a)}];}); }
      else{const e=await r.json();if(inputRef.current)inputRef.current.value=text;setSendStatus(e.message||'Failed');setTimeout(()=>setSendStatus(''),3000);}
    }catch(e){if(inputRef.current)inputRef.current.value=text;setSendStatus(e.message);setTimeout(()=>setSendStatus(''),3000);}
    setSending(false);
  }


  if(clients.length===0) return html`
    <div class="view-content animate-fade" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh">
      <div class="view-empty" style="max-width:360px">
        <${I} name="message-circle" size=${44} style="margin-bottom:14px;color:var(--text-3);opacity:.5"/>
        <p style="color:var(--text-1);font-size:16px;font-weight:700;font-family:var(--font-hd);margin-bottom:6px">No tokens connected</p>
        <p style="color:var(--text-2);font-size:13px;line-height:1.5">Add nodes in Settings to browse DMs, groups, and servers.</p>
      </div>
    </div>`;

  const dmTabLabel={dms:'DMs',groups:'Groups',servers:'Servers'}[dmTab];

  return html`
    <div class="animate-fade" style="padding:0;display:flex;flex-direction:column;height:100%;overflow:hidden">
      <div class="view-header" style="height:auto;min-height:58px;padding:10px 20px;gap:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <span class="view-panel-icon" style="width:36px;height:36px"><${I} name="message-circle" size=${18}/></span>
          <div>
            <h1 class="view-title" style="font-size:16px">Messages</h1>
            <p style="font-size:10px;color:var(--text-3);margin-top:1px">${dmTabLabel} · ${clients.length} token${clients.length!==1?'s':''}</p>
          </div>
        </div>
        <div class="view-tabs" style="margin-bottom:0;padding:3px">
          ${[['dms','DMs','user'],['groups','Groups','users'],['servers','Servers','layers']].map(([id,label,icon])=>html`
            <button key=${id} class=${'view-tab-btn'+(dmTab===id?' active':'')} onClick=${()=>setDmTab(id)} style="padding:7px 16px;font-size:12px">
              <${I} name=${icon} size=${12}/> ${label}
            </button>
          `)}
        </div>
      </div>

      <div class="messages-shell">
        <div class="messages-sidebar">
          <div class="messages-token-bar">
            <div class="messages-token-select">
              <div style="width:28px;height:28px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden">
                ${resolvedAvatars[tokenId]
                  ? html`<img src=${resolvedAvatars[tokenId]} style="width:100%;height:100%;object-fit:cover"/>`
                  : html`<${I} name="user" size=${14} style="color:var(--accent)"/>`}
              </div>
              <select value=${tokenId} onChange=${e=>setTokenId(e.target.value)}>
                ${clients.map(c=>html`<option key=${c.id} value=${c.id} style="background:var(--bg-card)">${c.tag?.split('#')[0]||'Unknown'}</option>`)}
              </select>
            </div>
          </div>

          <div class="messages-list-scroll">
            ${loading
              ? html`<div style="display:flex;align-items:center;justify-content:center;padding:56px 0;opacity:.35"><${I} name="loader" size=${24} style="animation:spin 1s linear infinite"/></div>`
              : items.length===0
                ? html`<div class="view-empty" style="padding:40px 16px;margin:8px">
                    <${I} name=${dmTab==='servers'?'layers':dmTab==='groups'?'users':'message-circle'} size=${32} style="margin-bottom:12px;color:var(--text-3);opacity:.4"/>
                    <p style="font-size:12px;font-weight:600;color:var(--text-2)">${dmTab==='servers'?'No servers':dmTab==='groups'?'No group chats':'No DMs'}</p>
                  </div>`
                : items.map(item=>{
                    const name = dmTab==='servers' ? item.name : getDmName(item);
                    const av   = dmTab==='servers' ? getServerIcon(item) : getDmAvatar(item);
                    const sel  = selectedItem?.id===item.id;
                    const hasLive = (liveMessages||[]).some(m=>m.channelId===item.id||m.guildId===item.id);
                    return html`<button key=${item.id} class=${'messages-list-btn'+(sel?' active':'')} onClick=${()=>openItem(item)}>
                      <div style="position:relative;flex-shrink:0">
                        <div style="width:38px;height:38px;border-radius:${dmTab==='servers'?'10px':'50%'};background:var(--bg-hover);overflow:hidden;border:1px solid var(--border-soft)">
                          ${av
                            ? html`<img src=${av} style="width:100%;height:100%;object-fit:cover"/>`
                            : html`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--text-2);font-family:var(--font-hd)">${(name||'?')[0].toUpperCase()}</div>`}
                        </div>
                        ${hasLive&&!sel&&html`<div style="position:absolute;top:0;right:0;width:9px;height:9px;border-radius:50%;background:var(--success);border:2px solid var(--bg-side);box-shadow:0 0 6px var(--success)"></div>`}
                      </div>
                      <div style="flex:1;min-width:0">
                        <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${sel?'var(--text-0)':'var(--text-1)'}">${name}</div>
                        ${dmTab==='groups'&&html`<div style="font-size:10px;color:var(--text-3);margin-top:2px">${item.recipients?.length||0} members</div>`}
                        ${dmTab==='servers'&&html`<div style="font-size:10px;color:var(--text-3);margin-top:2px">Server</div>`}
                      </div>
                      ${sel&&html`<div style="width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 6px var(--accent)"></div>`}
                    </button>`;
                  })
            }
          </div>
        </div>

        <div style="flex:1;display:flex;flex-direction:column;background:var(--bg-app);position:relative;min-width:0">

          ${showServerChannels ? html`
            <div style="flex:1;overflow-y:auto">
              <div class="messages-chat-hdr">
                <button onClick=${()=>setSelectedItem(null)}
                  style="width:32px;height:32px;border-radius:9px;background:var(--bg-hover);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
                  <${I} name="x" size=${15}/>
                </button>
                ${getServerIcon(selectedItem)
                  ? html`<img src=${getServerIcon(selectedItem)} style="width:34px;height:34px;border-radius:10px;object-fit:cover;border:1px solid var(--border-soft)"/>`
                  : html`<span class="view-panel-icon" style="width:34px;height:34px"><${I} name="layers" size=${16}/></span>`}
                <div style="flex:1;min-width:0">
                  <div style="font-family:var(--font-hd);font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${selectedItem.name}</div>
                  <div style="font-size:11px;color:var(--text-3);margin-top:2px">${channels.length} text channels</div>
                </div>
              </div>
              ${chatLoading
                ? html`<div style="display:flex;align-items:center;justify-content:center;padding:80px 0;opacity:.35"><${I} name="loader" size=${28} style="animation:spin 1s linear infinite"/></div>`
                : channels.length===0
                  ? html`<div class="view-empty" style="margin:24px"><p style="font-size:13px;font-weight:600;color:var(--text-2)">No text channels found</p></div>`
                  : html`<div class="messages-channel-grid">
                      ${channels.map(ch=>html`
                        <button key=${ch.id} class="messages-channel-btn" onClick=${()=>openChannel(ch)}>
                          <${I} name="hash" size=${16} style="color:var(--text-3);flex-shrink:0"/>
                          <span style="font-weight:600;font-size:14px">${ch.name}</span>
                        </button>`)}
                    </div>`}
            </div>`

          : showChat ? html`
            <div class="messages-chat-hdr">
              <button onClick=${()=>{if(selectedChannel)setSelectedChannel(null);else setSelectedItem(null);}}
                style="width:30px;height:30px;border-radius:9px;background:var(--bg-hover);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
                <${I} name="x" size=${15}/>
              </button>
              ${dmTab==='servers'&&selectedChannel?html`<${I} name="hash" size=${16} style="color:var(--text-3)"/>`:null}
              <span style="font-weight:700;font-size:15px;font-family:var(--font-hd);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                ${selectedChannel ? selectedChannel.name : getDmName(selectedItem)}
              </span>
              <button
                onClick=${()=>{
                  const id=activeChannelId;
                  if(!id)return;
                  navigator.clipboard.writeText(id).then(()=>{setCopiedId(true);setTimeout(()=>setCopiedId(false),2000);}).catch(()=>{
                    const ta=document.createElement('textarea');ta.value=id;ta.style.position='fixed';ta.style.opacity='0';
                    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch{}document.body.removeChild(ta);
                    setCopiedId(true);setTimeout(()=>setCopiedId(false),2000);
                  });
                }}
                class="btn-secondary"
                style=${{padding:'6px 12px',fontSize:'11px',fontWeight:'700',background:copiedId?'rgba(31,217,122,.1)':'',borderColor:copiedId?'rgba(31,217,122,.3)':'',color:copiedId?'var(--success)':'',flexShrink:0}}>
                ${copiedId?html`<${I} name="check" size=${12} style="margin-right:4px"/>`:null}
                ${copiedId?'Copied':'Copy ID'}
              </button>
              ${chatLoading&&html`<${I} name="loader" size=${15} style="animation:spin 1s linear infinite;color:var(--text-3)"/>`}
            </div>
